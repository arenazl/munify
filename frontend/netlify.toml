[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy al backend: se GENERA en el build (scripts/gen-redirects.mjs) en dist/_redirects
# desde BACKEND_ORIGIN, por ambiente. NADA de host hardcodeado aca — eso causaba el leak
# qa->prod. Netlify procesa _redirects ANTES que netlify.toml, asi que el proxy vive en
# el archivo generado (junto con su propio catch-all SPA).

# SPA fallback (React Router) — respaldo; el _redirects generado ya trae su catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estaticos (content-hash en el nombre → immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# auto-update-kit — el HTML de arranque, el Service Worker y el manifiesto de
# versión NUNCA se cachean: es lo que hace que el deploy nuevo se vea sin hard
# refresh y sin reinstalar la PWA. La RAÍZ va aparte de `/index.html`: la PWA
# arranca en `/` y ese pedido no siempre hereda la regla del archivo.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# Una sola regla para el SW (antes estaba declarado dos veces, con valores
# distintos: ganaba el último y el primero era ruido muerto).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
