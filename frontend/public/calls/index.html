<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llamados">
<title>Llamados Munify</title>
<style>
:root{
 --bg:#0f1720; --bg2:#141e2a; --card:#1a2635; --card2:#213040; --line:#2b3b4e; --line2:#3a4c62;
 --ink:#e8eef6; --ink2:#9db0c6; --ink3:#6d829c;
 --acc:#3d8bfd; --acc2:#2f6fd0;
 --ok:#35c07f; --warn:#e2a33c; --bad:#e06c6c; --purple:#9a7bdc;
 --r:12px;
}

:root[data-tema="claro"]{
 --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f7; --line:#dfe5ec; --line2:#c8d2de;
 --ink:#16212e; --ink2:#4d5f75; --ink3:#7c8ca1;
 --acc:#2f6fd0; --acc2:#245ab0;
 --ok:#1e9e63; --warn:#b57611; --bad:#c94a4a; --purple:#7357bd;
}
:root[data-tema="claro"] header.top{background:rgba(244,246,249,.96)}
:root[data-tema="claro"] footer.pie{background:rgba(244,246,249,.97)}
:root[data-tema="claro"] .row,:root[data-tema="claro"] .box,:root[data-tema="claro"] .h-it{box-shadow:0 1px 2px rgba(20,34,51,.05)}
:root[data-tema="claro"] .eb.on[data-e=contactado]{color:#fff}
:root[data-tema="claro"] .eb.on[data-e=no-atiende]{color:#fff}
.tema{background:var(--card);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;width:34px;height:34px;
 cursor:pointer;display:grid;place-items:center;flex:none;transition:.12s;padding:0}
.tema:hover{border-color:var(--acc);color:var(--acc)}
.tema svg{width:17px;height:17px;display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
input,textarea,select,button{font-family:inherit;font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 92px}

header.top{position:sticky;top:0;z-index:40;background:rgba(15,23,32,.96);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding-top:max(env(safe-area-inset-top),8px)}
.top-in{max-width:1180px;margin:0 auto;padding:0 14px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px;font-size:17px}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--purple));
 display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;font-weight:800}
.spacer{flex:1}
.kpis{display:flex;gap:7px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.kpi b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.pu b{color:var(--purple)}

.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:13px 0 4px}
.chip{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:6px 13px;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip .n{opacity:.7;font-size:11.5px;margin-left:4px}
.buscar{flex:1;min-width:190px;position:relative}
.buscar input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:999px;
 padding:9px 15px 9px 15px;color:var(--ink);outline:none}
.buscar input:focus{border-color:var(--acc)}

.lista{display:grid;gap:9px;margin-top:11px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
 display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--line2);background:var(--card2)}
.row.sel{border-color:var(--acc)}
.row.done{opacity:.6}
.est{width:8px;height:38px;border-radius:5px;background:var(--line2);flex:none}
.est.contactado{background:var(--ok)} .est.no-atiende{background:var(--warn)}
.est.rellamar{background:var(--purple)} .est.descartado{background:var(--bad)}
.info{min-width:0}
.info h3{margin:0 0 2px;font-size:15.5px;font-weight:700;letter-spacing:-.15px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink2);font-weight:600}
.tel-btn{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:#fff;text-decoration:none;
 border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tel-btn:hover{background:var(--acc2)}
.tel-btn.hecho{background:var(--card2);color:var(--ink2);border:1px solid var(--line2)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);
 color:var(--ink3);margin-left:6px;vertical-align:middle}
.badge.n{border-color:var(--purple);color:var(--purple)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.18s}
.ov.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);z-index:61;
 border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);
 display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.panel.on{transform:none}
.p-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.p-head h2{margin:0 0 3px;font-size:19px;letter-spacing:-.3px}
.p-head .meta{font-size:13px;white-space:normal}
.x{background:var(--card);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;width:32px;height:32px;
 cursor:pointer;flex:none;font-size:18px;line-height:1}
.p-body{flex:1;overflow-y:auto;padding:14px 16px 34px;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:18px}
.sec>label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
 margin-bottom:7px;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
 font-size:14px;color:var(--ink2);line-height:1.6}
.box.script{border-left:3px solid var(--acc);color:var(--ink)}
.box.perfil{border-left:3px solid var(--purple)}
.p-tel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.p-tel a.tel-btn{flex:1;justify-content:center;font-size:16.5px;padding:13px}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:9px;padding:9px 13px;
 cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.estados{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px}
.eb{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:9px;padding:10px 8px;
 cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:.12s}
.eb:hover{border-color:var(--ink3)}
.eb.on[data-e=contactado]{background:var(--ok);border-color:var(--ok);color:#04240f}
.eb.on[data-e=no-atiende]{background:var(--warn);border-color:var(--warn);color:#1a1200}
.eb.on[data-e=rellamar]{background:var(--purple);border-color:var(--purple);color:#fff}
.eb.on[data-e=descartado]{background:var(--bad);border-color:var(--bad);color:#fff}
textarea,input.f{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;
 padding:11px 12px;color:var(--ink);outline:none;resize:vertical;line-height:1.55}
textarea:focus,input.f:focus{border-color:var(--acc)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hist{display:grid;gap:7px}
.h-it{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink2)}
.h-it time{color:var(--ink3);font-size:11.5px;display:block;margin-bottom:3px}
.h-it .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--line2)}
.vacio{color:var(--ink3);font-size:13.5px;padding:14px 2px;line-height:1.6;text-align:center}
.tips{display:grid;gap:8px}
.tip b{color:var(--ink);display:block;margin-bottom:3px}
footer.pie{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,32,.97);border-top:1px solid var(--line);
 padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:30}
.foot-in{max-width:1180px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.progress{flex:1;min-width:100px;height:6px;background:var(--card2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:999px;transition:width .3s}
@media(max-width:640px){
 .row{grid-template-columns:auto 1fr;gap:10px}
 .row .tel-btn{grid-column:2;justify-self:start;margin-top:7px}
 .kpis{width:100%;overflow-x:auto}
 .fila2{grid-template-columns:1fr}
 .top-in{gap:9px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i>M</i> Llamados</div>
  <div class="spacer"></div>
  <button class="tema" id="btnTema" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
  <div class="kpis" id="kpis"></div>
</div></header>

<div class="wrap">
  <div class="filtros" id="fPais"></div>
  <div class="filtros" style="padding-top:0">
    <div id="fEstado" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <div class="buscar"><input id="q" type="search" placeholder="Buscar municipio, provincia o telefono..." autocomplete="off"></div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="vacio" id="vacio" style="display:none"></div>
</div>

<footer class="pie"><div class="foot-in">
  <span id="pieTxt"></span>
  <div class="progress"><i id="pieBar" style="width:0%"></i></div>
  <button class="btn sm" id="btnExport">Bajar copia</button>
  <button class="btn sm" id="btnImport">Restaurar</button>
  <input type="file" id="fileImport" accept="application/json" style="display:none">
</div></footer>

<div class="ov" id="ov"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="p-head">
    <div style="flex:1;min-width:0">
      <h2 id="pTitulo"></h2>
      <div class="meta" id="pMeta"></div>
    </div>
    <button class="x" id="pClose" aria-label="Cerrar">&times;</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

or (como San Pedro o municipios similares en la región) implementando una plataforma de gestión ciudadana que centraliza los reclamos de bacheo, luminarias y servicios en un solo tablero inteligente para el Ejecutivo. Hoy los municipios chicos están resolviendo la trazabilidad de los reclamos en menos de 48 horas sin que el vecino tenga que ir presencialmente a la municipalidad a hacer colas. ¿Con quién me sugerís que converse cinco minutos para dejarle un caso de éxito medido en su misma provincia?"},"Paraguay":{"titulo":"Paraguay","pulso":"Hay muchísimo orgullo por el crecimiento económico, el comercio y el desarrollo local. Valoran enormemente la prolijidad institucional, la transparencia administrativa frente a la Junta Municipal (concejales) y el orden de los tributos.","angulo":"Transparencia, recaudación ordenada y modernización al nivel de las grandes ciudades del Mercosur.","script":"¿Cómo le va, muy buenos días? Le hablo desde Argentina en representación de Munify. Estamos expandiendo nuestra plataforma de gestión y reporte ciudadano a municipios pujantes de Paraguay, enfocándonos en intendencias que están digitalizando la atención al contribuyente. Nuestra herramienta le permite al intendente tener tableros de control en tiempo real sobre el estado de los servicios urbanos y las cuadrillas en la calle, evitando la dispersión de reclamos por WhatsApp o llamadas sueltas. ¿Me podría derivar con el director de gabinete o secretaría general para enviarle un breve resumen de cómo estamos trabajando en ciudades de escala similar?"},"Perú":{"titulo":"Perú","pulso":"Las municipalidades manejan presupuestos por canon (minero, petrolero, aduanero) y están bajo la lupa fiscal permanente de la Contraloría General de la República. El alcalde sufre horrores la gestión documentaria ineficiente y la falta de indicadores de cumplimiento para rendir cuentas.","angulo":"Trazabilidad de obras, cumplimiento de metas institucionales (como los incentivos municipales del MEF) y ordenamiento frente a la Contraloría.","script":"Buenos días, estimado, le saludo de la empresa tecnológica Munify. Nos estamos comunicando con municipalidades provinciales y distritales que están optimizando sus indicadores de gestión y la atención ciudadana. Nosotros proveemos un sistema integral de trazabilidad de reportes urbanos y expedientes que le asegura al despacho de alcaldía métricas claras de resolución ante la Contraloría y los vecinos. ¿Con qué área de gerencia municipal o sistemas podría coordinar una demostración técnica de 10 minutos adaptada a la jurisdicción?"},"Uruguay":{"titulo":"Uruguay","pulso":"Es una administración extremadamente metódica, seria, de procesos muy formales. No les gusta la venta agresiva ni el \"vendehumo\". Van directo a los papeles, los antecedentes institucionales y la robustez técnica.","angulo":"Gobierno abierto, descentralización departamental y optimización de flujos de trabajo de las direcciones de obras y servicios.","script":"Buenos días, ¿cómo le va? Lo molesto brevemente desde Munify. Somos una compañía de desarrollo de software enfocada en plataformas de gobierno abierto y gestión de incidencias para administraciones públicas locales. Estamos vinculándonos con las Intendencias Departamentales del interior uruguayo para aportar tableros de control dinámicos que agilicen la respuesta de las direcciones territoriales. ¿Me indicaría cuál es el canal formal o la secretaría de intendencia para hacerle llegar nuestro dossier corporativo y un acceso de cortesía a nuestras estaciones de prueba?"}},"tips":[{"titulo":"La \"Patria Comtec\" o la empresa establecida","texto":"Como dijiste que sos de Argentina y estás establecido acá, úsalo a favor. En Paraguay, Perú y Uruguay hay un gran respeto por el desarrollo de software argentino (por la industria potente que hay). Decir \"somos una empresa tecnológica consolidada en Argentina\" te da chapa de estabilidad y soporte técnico real, no sos un pibe con una notebook desde su casa."},{"titulo":"El gancho de la demo express","texto":"Si el secretario te atiende y muestra un mínimo de interés, no te pongas a explicar código. Tirá la frase mágica: \"Mirá, te propongo algo: pásame por WhatsApp el nombre exacto de tu municipio, yo te armo una demo en 10 segundos con los datos reales de tu ejido urbano y te mando un video de un minuto mostrando cómo tus vecinos reportarían un bache en tu propia plaza principal. Si te gusta, lo charlamos\". Ahí los matas."},{"titulo":"Atacar al segundo de a bordo","texto":"Al intendente o alcalde es difícil pillarlo de entrada. Apunta siempre al Secretario de Gobierno, Gerente Municipal o Director de Modernización. Ese es el que sufre el día a día operativo y es el que le va a decir al intendente: \"Jefe, mire esta herramienta, nos va a solucionar el dolor de cabeza de los reclamos\"."}],"generado":"2026-08-26","fuente":"docs/regiones"};
const CONTACTOS = DATOS.contactos || [];
const SPEECH = DATOS.speeches || {};
const TIPS = DATOS.tips || [];
const KEY = 'munify_llamados_v1';
const ESTADOS = [
  {id:'',            lbl:'Sin llamar'},
  {id:'contactado',  lbl:'Contactado'},
  {id:'no-atiende',  lbl:'No atiende'},
  {id:'rellamar',    lbl:'Volver a llamar'},
  {id:'descartado',  lbl:'Descartado'},
];
const LBL = Object.fromEntries(ESTADOS.map(e => [e.id, e.lbl]));

let db = cargar();
let fPais = '', fEstado = '', q = '', selId = null;

function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} pintarKpis(); pintarPie(); }
function reg(id){ if(!db[id]) db[id] = {estado:'', notas:'', proximo:'', quien:'', hist:[]}; return db[id]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function telHref(t){ return 'tel:' + String(t).replace(/[^\d+]/g,''); }
function ahora(){ const d = new Date(); return d.toISOString(); }
function fecha(iso){ try { const d = new Date(iso); return d.toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } }

function filtrados(){
  const t = q.trim().toLowerCase();
  return CONTACTOS.filter(c => {
    if (fPais && c.pais !== fPais) return false;
    const e = (db[c.id]||{}).estado || '';
    if (fEstado === 'pend' ? e !== '' : fEstado && e !== fEstado) return false;
    if (!t) return true;
    return (c.localidad + ' ' + c.region + ' ' + c.telefono + ' ' + c.pais).toLowerCase().includes(t);
  });
}

function pintarFiltros(){
  const paises = [...new Set(CONTACTOS.map(c => c.pais))];
  const cont = document.getElementById('fPais');
  cont.innerHTML = ['<button class="chip'+(fPais===''?' on':'')+'" data-p="">Todos<span class="n">'+CONTACTOS.length+'</span></button>']
    .concat(paises.map(p => {
      const n = CONTACTOS.filter(c => c.pais === p).length;
      return '<button class="chip'+(fPais===p?' on':'')+'" data-p="'+esc(p)+'">'+esc(p)+'<span class="n">'+n+'</span></button>';
    })).join('');
  cont.querySelectorAll('.chip').forEach(b => b.onclick = () => { fPais = b.dataset.p; pintar(); });

  const ce = document.getElementById('fEstado');
  const opts = [{id:'',lbl:'Todos'},{id:'pend',lbl:'Sin llamar'}].concat(ESTADOS.filter(e => e.id));
  ce.innerHTML = opts.map(o => {
    let n;
    if (o.id === '') n = CONTACTOS.length;
    else if (o.id === 'pend') n = CONTACTOS.filter(c => !((db[c.id]||{}).estado)).length;
    else n = CONTACTOS.filter(c => (db[c.id]||{}).estado === o.id).length;
    return '<button class="chip'+(fEstado===o.id?' on':'')+'" data-e="'+o.id+'">'+o.lbl+'<span class="n">'+n+'</span></button>';
  }).join('');
  ce.querySelectorAll('.chip').forEach(b => b.onclick = () => { fEstado = b.dataset.e; pintar(); });
}

function pintarLista(){
  const arr = filtrados();
  const cont = document.getElementById('lista');
  const vac = document.getElementById('vacio');
  if (!arr.length){
    cont.innerHTML = '';
    vac.style.display = 'block';
    vac.textContent = q ? 'Ningun municipio coincide con "' + q + '".' : 'No hay municipios en este filtro. Proba con otro estado o pais.';
    return;
  }
  vac.style.display = 'none';
  cont.innerHTML = arr.map(c => {
    const r = db[c.id] || {};
    const e = r.estado || '';
    const nNotas = (r.hist||[]).length;
    return '<div class="row'+(e?' done':'')+(selId===c.id?' sel':'')+'" data-id="'+c.id+'">'
      + '<span class="est '+e+'"></span>'
      + '<div class="info"><h3>'+esc(c.localidad)
      + (e ? '<span class="badge">'+LBL[e]+'</span>' : '')
      + (nNotas ? '<span class="badge n">'+nNotas+'</span>' : '')
      + '</h3><div class="meta"><b>'+esc(c.region)+'</b> &middot; '+esc(c.pais)+' &middot; '+esc(c.habitantes)+'</div></div>'
      + '<a class="tel-btn'+(e?' hecho':'')+'" href="'+telHref(c.telefono)+'" data-tel="'+c.id+'">'+esc(c.telefono)+'</a>'
      + '</div>';
  }).join('');
  cont.querySelectorAll('.row').forEach(r => r.onclick = ev => {
    if (ev.target.closest('a')) return;
    abrir(r.dataset.id);
  });
  cont.querySelectorAll('a[data-tel]').forEach(a => a.onclick = () => {
    const id = a.dataset.tel, r = reg(id);
    r.hist.push({t: ahora(), tipo:'llamada', txt:'Llamada iniciada'});
    if (!r.estado) r.estado = 'no-atiende';
    guardar(); pintar(); setTimeout(() => abrir(id), 250);
  });
}

function pintarKpis(){
  const n = CONTACTOS.length;
  const cont = CONTACTOS.filter(c => (db[c.id]||{}).estado === 'contactado').length;
  const rell = CONTACTOS.filter(c => (db[c.id]||{}).estado === 'rellamar').length;
  const pend = CONTACTOS.filter(c => !((db[c.id]||{}).estado)).length;
  document.getElementById('kpis').innerHTML =
      '<span class="kpi">Total <b>'+n+'</b></span>'
    + '<span class="kpi ok">Contactados <b>'+cont+'</b></span>'
    + '<span class="kpi pu">Rellamar <b>'+rell+'</b></span>'
    + '<span class="kpi warn">Sin llamar <b>'+pend+'</b></span>';
}

function pintarPie(){
  const n = CONTACTOS.length;
  const hechos = CONTACTOS.filter(c => (db[c.id]||{}).estado).length;
  const pct = n ? Math.round(hechos*100/n) : 0;
  document.getElementById('pieBar').style.width = pct + '%';
  document.getElementById('pieTxt').textContent = hechos + ' de ' + n + ' gestionados (' + pct + '%)';
}

function pintar(){ pintarFiltros(); pintarLista(); pintarKpis(); pintarPie(); }

function abrir(id){
  const c = CONTACTOS.find(x => x.id === id); if (!c) return;
  selId = id;
  const r = reg(id);
  const sp = SPEECH[c.pais] || {};
  document.getElementById('pTitulo').textContent = c.localidad;
  document.getElementById('pMeta').innerHTML = '<b>'+esc(c.region)+'</b> &middot; '+esc(c.pais)+' &middot; '+esc(c.habitantes)+' hab. &middot; '+esc(c.lote);
  document.getElementById('pBody').innerHTML =
      '<div class="p-tel"><a class="tel-btn" href="'+telHref(c.telefono)+'" id="pLlamar">Llamar '+esc(c.telefono)+'</a>'
    + '<button class="btn" id="pCopiar">Copiar</button></div>'
    + '<div class="sec"><label>Como llega el municipio</label><div class="box perfil">'+esc(c.perfil)+'</div></div>'
    + (sp.script ? '<div class="sec"><label>Speech para '+esc(c.pais)+'</label>'
        + '<div class="box script">'+esc(sp.script)+'</div>'
        + (sp.pulso ? '<div class="box" style="margin-top:7px"><b style="color:var(--ink)">El pulso:</b> '+esc(sp.pulso)+'</div>' : '')
        + (sp.angulo ? '<div class="box" style="margin-top:7px"><b style="color:var(--ink)">Angulo de venta:</b> '+esc(sp.angulo)+'</div>' : '')
        + '<button class="btn sm" id="pCopiarScript" style="margin-top:8px">Copiar speech</button></div>' : '')
    + '<div class="sec"><label>Como termino la llamada</label><div class="estados" id="pEstados">'
      + ESTADOS.filter(e => e.id).map(e => '<button class="eb'+(r.estado===e.id?' on':'')+'" data-e="'+e.id+'">'+e.lbl+'</button>').join('')
      + '</div></div>'
    + '<div class="sec"><label>Que me dijo</label>'
      + '<textarea id="pNotas" rows="4" placeholder="Con quien hable, que area, que dijo, cuando conviene volver...">'+esc(r.notas)+'</textarea>'
      + '<div class="fila2" style="margin-top:9px">'
      + '<input class="f" id="pQuien" placeholder="Con quien hable" value="'+esc(r.quien)+'">'
      + '<input class="f" id="pProximo" type="date" value="'+esc(r.proximo)+'">'
      + '</div>'
      + '<button class="btn p" id="pGuardar" style="margin-top:9px;width:100%">Guardar en el historial</button></div>'
    + '<div class="sec"><label>Historial</label><div class="hist" id="pHist"></div></div>'
    + (TIPS.length ? '<div class="sec"><label>Recordar siempre</label><div class="tips">'
        + TIPS.map(t => '<div class="box tip"><b>'+esc(t.titulo)+'</b>'+esc(t.texto)+'</div>').join('') + '</div></div>' : '');

  pintarHist();
  document.getElementById('ov').classList.add('on');
  document.getElementById('panel').classList.add('on');
  document.getElementById('panel').setAttribute('aria-hidden','false');

  document.getElementById('pLlamar').onclick = () => {
    r.hist.push({t: ahora(), tipo:'llamada', txt:'Llamada iniciada'});
    if (!r.estado) r.estado = 'no-atiende';
    guardar(); pintarHist(); pintarLista();
  };
  document.getElementById('pCopiar').onclick = () => copiar(c.telefono, 'pCopiar', 'Copiar');
  const bs = document.getElementById('pCopiarScript');
  if (bs) bs.onclick = () => copiar(sp.script, 'pCopiarScript', 'Copiar speech');
  document.querySelectorAll('#pEstados .eb').forEach(b => b.onclick = () => {
    r.estado = (r.estado === b.dataset.e) ? '' : b.dataset.e;
    r.hist.push({t: ahora(), tipo:'estado', txt: r.estado ? ('Marcado: ' + LBL[r.estado]) : 'Estado borrado'});
    guardar(); abrir(id); pintarLista();
  });
  document.getElementById('pGuardar').onclick = () => {
    const nt = document.getElementById('pNotas').value.trim();
    r.notas = nt;
    r.quien = document.getElementById('pQuien').value.trim();
    r.proximo = document.getElementById('pProximo').value;
    if (nt) r.hist.push({t: ahora(), tipo:'nota', txt: nt});
    if (r.proximo) r.hist.push({t: ahora(), tipo:'agenda', txt:'Volver a llamar el ' + r.proximo});
    document.getElementById('pNotas').value = '';
    guardar(); pintarHist(); pintarLista();
    const b = document.getElementById('pGuardar'); b.textContent = 'Guardado'; setTimeout(() => b.textContent = 'Guardar en el historial', 1200);
  };
}

function pintarHist(){
  const r = reg(selId);
  const el = document.getElementById('pHist'); if (!el) return;
  const h = (r.hist || []).slice().reverse();
  if (!h.length){ el.innerHTML = '<div class="vacio">Todavia no hay movimientos. Cuando llames o anotes algo, queda aca.</div>'; return; }
  const col = {llamada:'var(--acc)', estado:'var(--ok)', nota:'var(--purple)', agenda:'var(--warn)'};
  el.innerHTML = h.map(x => '<div class="h-it"><time>'+fecha(x.t)+'</time>'
    + '<span class="dot" style="background:'+(col[x.tipo]||'var(--line2)')+'"></span>'+esc(x.txt)+'</div>').join('');
}

function copiar(txt, btnId, orig){
  const b = document.getElementById(btnId);
  const fin = () => { if(b){ b.textContent = 'Copiado'; setTimeout(() => b.textContent = orig, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fin).catch(fin);
  else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
         try { document.execCommand('copy'); } catch(e){} document.body.removeChild(t); fin(); }
}

function cerrar(){
  selId = null;
  document.getElementById('ov').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
  document.getElementById('panel').setAttribute('aria-hidden','true');
  pintarLista();
}
document.getElementById('ov').onclick = cerrar;
document.getElementById('pClose').onclick = cerrar;
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
document.getElementById('q').oninput = e => { q = e.target.value; pintarLista(); };

document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'llamados-munify-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { db = JSON.parse(rd.result) || {}; guardar(); pintar(); } catch(err){ alert('El archivo no se pudo leer'); } };
  rd.readAsText(f);
};

/* ---- Tema: luna para el modo claro, sol para volver al oscuro ---- */
const LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const KEY_TEMA = 'munify_llamados_tema';
function aplicarTema(t){
  document.documentElement.setAttribute('data-tema', t);
  const b = document.getElementById('btnTema');
  if (b){
    b.innerHTML = t === 'claro' ? SOL : LUNA;
    b.title = t === 'claro' ? 'Volver al modo oscuro' : 'Pasar al modo claro';
    b.setAttribute('aria-label', b.title);
  }
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'claro' ? '#f4f6f9' : '#0f1720');
  try { localStorage.setItem(KEY_TEMA, t); } catch(e){}
}
(function initTema(){
  let t = null;
  try { t = localStorage.getItem(KEY_TEMA); } catch(e){}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'oscuro';
  aplicarTema(t);
  document.getElementById('btnTema').onclick = () =>
    aplicarTema(document.documentElement.getAttribute('data-tema') === 'claro' ? 'oscuro' : 'claro');
})();

pintar();
</script>
</body></html>
