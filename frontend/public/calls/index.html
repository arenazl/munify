/* Cache por municipio+modulo: el endpoint publico tiene rate limit (40/hora)
   y sin esto se quema en un par de fichas. */
const KEY_MODIA = 'munify_llamados_modia';
let modiaCache = (function(){ try { return JSON.parse(localStorage.getItem(KEY_MODIA) || '{}'); } catch(e){ return {}; } })();
function modiaGuardar(){ try { localStorage.setItem(KEY_MODIA, JSON.stringify(modiaCache)); } catch(e){} }

const MODIA_SISTEMA = [
  'Sos el asistente de un vendedor argentino que esta EN MEDIO de una llamada a un municipio,',
  'ofreciendo Munify, una plataforma de gestion municipal.',
  'Te paso la ficha del municipio y los HECHOS de UNO de sus modulos.',
  'Contale que hace ese modulo, dicho de manera que a ESTE municipio le cierre: por que le sirve a ellos,',
  'con que enganchar.',
  'FORMATO: dos parrafos de 25 palabras cada uno. 55 palabras EN TOTAL como maximo, es un tope duro:',
  'esto se lee en una columna angosta, en el medio de una llamada. Español rioplatense, de vos.',
  'Nada de titulos, ni vinetas, ni negritas, ni comillas de ningun tipo: texto corrido para decir en voz alta.',
  'Empeza DIRECTO por el contenido. Prohibido arrancar con "mira", "bueno", "claro" o "por supuesto".',
  'REGLA INVIOLABLE, la mas importante de todas: CADA funcion que menciones tiene que estar,',
  'textualmente, en la lista de hechos que te paso. Si no esta en la lista, NO EXISTE: no la digas.',
  'Prohibido traer funciones de OTROS modulos (si la lista no habla de fotos, no hay fotos; si no habla',
  'de geolocalizacion, no hay geolocalizacion). Prohibido inventar cifras, plazos, precios, casos de exito',
  'o integraciones. De la ficha del municipio podes usar el contexto —su tamaño, sus areas, si ya tienen',
  'algo digital, como piensa el intendente— para elegir el enfasis, pero NUNCA para agregar una funcion.',
  'Un dato inventado dicho por telefono a un intendente es un papelon irreparable: preferi decir menos.'
].join(' ');

async function modIA(c, m){
  const caja = document.getElementById('modia-' + m.id); if (!caja || !m) return;
  const k = c.id + '|' + m.id;
  const pintar = (txt, cacheado) => {
    caja.innerHTML = '<div class="mod-txt">'
      + String(txt).split(NL).map(x => x.trim()).filter(Boolean).map(t => '<p>' + esc(t) + '</p>').join('')
      + '<div class="mod-pie"><span>Para ' + esc(c.localidad) + '</span>'
      + '<button type="button" class="lnk" data-otra="' + m.id + '">Otra vuelta</button></div></div>';
    // Con el texto a la vista, el boton de abajo sobra: "Otra vuelta" ya lo
    // reemplaza, y dos botones que hacen lo mismo confunden en plena llamada.
    caja.parentElement.classList.add('gen');
    const b = caja.querySelector('[data-otra]');
    if (b) b.onclick = () => { delete modiaCache[k]; modiaGuardar(); modIA(c, m); };
  };
  if (modiaCache[k]){ pintar(modiaCache[k]); return; }
  caja.innerHTML = '<div class="mod-txt cargando">Buscando el ángulo para ' + esc(c.localidad) + '...</div>';
  caja.parentElement.classList.remove('gen');
  try {
    const kb = 'HECHOS DEL MODULO "' + m.t + '" (usa solo esto):' + NL + m.kb.map(x => '- ' + x).join(NL);
    const mensajes = [
      {role:'system', content: MODIA_SISTEMA},
      {role:'user', content: 'FICHA DEL MUNICIPIO:' + NL + iaContexto(c) + NL + NL + kb + NL + NL
        + 'Decime que le cuento de ' + m.t + ', usando SOLO los hechos de arriba.'}
    ];
    const res = await fetch(IA_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mensajes})});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
    const txt = String(j.respuesta || '').trim();
    if (!txt) throw new Error('respuesta vacia');
    if (selId !== c.id) return;                  // cambio de municipio mientras pensaba
    modiaCache[k] = txt; modiaGuardar();
    pintar(txt);
  } catch(e){
    if (selId !== c.id) return;
    caja.innerHTML = '<div class="mod-txt error">No pude generarlo ahora. '
      + '<button type="button" class="lnk" id="modiaRe">Reintentar</button></div>';
    const b = document.getElementById('modiaRe'); if (b) b.onclick = () => modIA(c, m);
  }
}

/* El veredicto comercial, de un vistazo: contra que competimos. */
function coVeredicto(t){
  if (!t) return {cl:'nada', tx:'Sin relevar'};
  if (/no tienen|sin app|nada digital|no cuenta con|no posee/i.test(t)) return {cl:'virgen', tx:'Terreno virgen'};
  if (/\bapp\b|aplicaci/i.test(t)) return {cl:'compite', tx:'Ya tienen app propia'};
  if (/portal|web|online|formulario/i.test(t)) return {cl:'parcial', tx:'Tienen web, no app'};
  return {cl:'nada', tx:'Sin relevar'};
}

function coPanel(clase, icono, rotulo, cuerpo, extra){
  return '<div class="co ' + clase + '">'
    + '<div class="co-h"><i class="co-ic"><svg viewBox="0 0 24 24">' + icono + '</svg></i>' + esc(rotulo) + '</div>'
    + (extra || '')
    + '<div class="co-b">' + cuerpo + '</div></div>';
}

  if (f.intendente) it.push(coPanel('jefe', CO_IC.jefe, 'Quién manda',

    + (f.partido ? ' · ' + esc(f.partido) : '')
    + (f.confianza && f.confianza !== 'alta' ? ' · dato ' + esc(f.confianza) + ', confirmalo' : '') + '</span>'));
  if (c.perfil) it.push(coPanel('perfil', CO_IC.perfil, 'Cómo llega', '<p class="rec">' + esc(c.perfil) + '</p>'));
  if (inv.estructura) it.push(coPanel('areas', CO_IC.areas, 'Áreas', '<p class="rec">' + esc(inv.estructura) + '</p>'));
  if (inv.digital){
    const v = coVeredicto(inv.digital);
    const chips = CO_CANALES.filter(x => x.re.test(inv.digital)).map(x =>
      '<span class="chip"><svg viewBox="0 0 24 24">' + x.ic + '</svg>' + x.k + '</span>').join('');
    it.push(coPanel('digital', CO_IC.digital, 'Qué usan hoy',

      '<div class="ver ' + v.cl + '">' + esc(v.tx) + '</div>' + (chips ? '<div class="chips">' + chips + '</div>' : '')));
  }
  if (inv.color) it.push(coPanel('hielo', CO_IC.hielo, 'Para romper el hielo', '<p class="rec">' + esc(inv.color) + '</p>'));
  if (inv.web) it.push(coPanel('web', CO_IC.web, 'Web',
    '<a href="' + esc(inv.web) + '" target="_blank" rel="noopener">' + esc(inv.web.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a>'));
  cont.innerHTML = it.length ? it.join('')

  /* Lo largo arranca recortado; el "más" lo abre en el lugar. */

    b.onclick = () => { const ab = p.classList.toggle('todo'); b.textContent = ab ? 'menos' : 'más'; };
    p.parentElement.appendChild(b);
  });
}

/* El texto del tema es FIJO — es el speech. Pero al lado tiene un refresh
   (dueño, 2026-08-30): si a la tercera llamada del dia ya te aburriste de tu
   propio libreto, la IA te lo dice de otra forma. Mismo contenido, otras
   palabras: no puede agregar nada que no este en el original. El original
   siempre esta a un clic ("volver al mio").  */
const TEMA_SISTEMA = [
  'Sos el asistente de un vendedor argentino que esta en medio de una llamada a un municipio.',
  'Te paso un parrafo que el vendedor ya usa para explicar un modulo de Munify, y la ficha del municipio.',
  'Reescribilo con OTRAS PALABRAS, para que no suene machete de tanto repetirlo.',
  'REGLA INVIOLABLE: no agregues NADA que no este en el texto original. Ni una funcion, ni una cifra,',
  'ni un plazo, ni un ejemplo. Solo podes reordenar, cambiar las palabras y elegir el enfasis segun',
  'el municipio. Si el original no lo dice, no existe.',
  'NUNCA mas largo que el original: mismo largo o mas corto, en la misma cantidad de parrafos.',
  'Español rioplatense, de vos.',
  'Nada de titulos ni vinetas: texto corrido para leer en voz alta. Empeza directo, sin "mira" ni "bueno".'
].join(' ');

function pintarTema(c, g, txt, estado){
  const caja = document.getElementById('pGuion'); if (!caja || !g) return;
  const parrafos = txt ? String(txt).split(NL).map(x => x.trim()).filter(Boolean) : g.p;
  const refresh = '<button type="button" class="g-re" id="gRe" title="Decilo de otra forma">'
    + '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>';
  caja.innerHTML = '<div class="g-txt' + (estado === 'ia' ? ' otra' : '') + '" data-g="' + g.id + '">' + refresh
    + parrafos.map(t => '<p>' + esc(t) + '</p>').join('')
    + (estado === 'ia' ? '<div class="g-pie"><span>Dicho de otra forma</span>'
        + '<button type="button" class="lnk" id="gMio">volver al mío</button></div>' : '')
    + (estado === 'pensando' ? '<div class="g-pie"><span>Buscando otra manera de decirlo...</span></div>' : '')
    + '</div>';
  const re = document.getElementById('gRe'); if (re) re.onclick = () => temaOtra(c, g);
  const mio = document.getElementById('gMio'); if (mio) mio.onclick = () => pintarTema(c, g);
}

async function temaOtra(c, g){
  pintarTema(c, g, null, 'pensando');
  try {
    const mensajes = [
      {role:'system', content: TEMA_SISTEMA},
      {role:'user', content: 'FICHA DEL MUNICIPIO:' + NL + iaContexto(c) + NL + NL
        + 'TEXTO ORIGINAL (' + g.t + '), no agregues nada que no este aca:' + NL + g.p.join(NL + NL)}
    ];
    const res = await fetch(IA_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mensajes})});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
    const txt = String(j.respuesta || '').trim();
    if (!txt) throw new Error('respuesta vacia');
    if (selId !== c.id) return;
    pintarTema(c, g, txt, 'ia');

/* LA NARRACION (dueño, 2026-08-30). Antes la ficha gritaba "Pregunta por
   Diego Costarelli" en un cartel y el speech entraba directo al pitch — pero
   el intendente casi nunca atiende el telefono. Ahora la apertura ubica la
   llamada, pide por el nombre, y en la MISMA frase da la salida (Modernizacion
   o el secretario). Despues el motivo BIEN CORTO: los cuatro ejes nombrados y
   nada mas. El detalle vive en los tabs de abajo, para cuando enganchan. */
function narracion(c, f){
  const cargo = (f.cargo || 'Intendente');
  const cargoL = cargo.toLowerCase();
  // Uruguay son Intendencias departamentales; el resto, Municipalidad.
  const ente = (c.pais === 'Uruguay' ? 'la Intendencia de ' : 'la Municipalidad de ') + c.localidad;
  const pedido = f.intendente
    ? 'Me habían dado para hablar con ' + f.intendente + ', si puede ser'
    : 'Quería hablar con el ' + cargoL + ', si puede ser';
  return [
    '¿Qué tal? Buenos días, te llamo de Munify. Me estoy comunicando con ' + ente + ', ¿verdad?',
    pedido + '. Y si no está, con algún representante o responsable del área de Modernización, o con el secretario del ' + cargoL + '.',
    'Te cuento en dos líneas por qué llamo: le queremos presentar una plataforma online para la relación con el vecino. Nuestra visión es conectar al vecino con el municipio, y lo hacemos con cuatro cosas: la gestión de los reclamos, los turnos para trámites, la tesorería, y la comunicación de todo lo que va haciendo el municipio.'
  ];
}

function abrir(id){
  const c = CONTACTOS.find(x => x.id === id); if (!c) return;
  if (selId !== id) cierreAbierto = false;
  selId = id;
  const r = reg(id), sp = SPEECH[c.pais] || {}, f = FUNC[c.id] || {};
  // El cierre habla como el pais del municipio, no como Buenos Aires.
  const cie = cierreDe(c.pais, c.localidad);
  /* El nombre del intendente ya no va en un cartel aparte: entra DENTRO de la
     narracion. Y todo lo que averiguamos del municipio se fue a la columna
     derecha ("Dato de color"): el centro es la narracion y nada mas. */
  const nar = narracion(c, f);
  const ojo = f.nota ? '<div class="box ojo" style="margin-bottom:13px"><b>Ojo:</b> ' + esc(f.nota) + '</div>' : '';
  document.getElementById('ficha').innerHTML =
      '<div class="f-head"><div><h2>' + esc(c.localidad) + '</h2>'
      + '<div class="meta">' + esc(c.region) + ' · ' + esc(c.pais) + ' · ' + esc(c.habitantes) + ' hab. · ' + esc(c.lote) + '</div></div>'
      + '<button class="cerrar-ficha" id="cerrarFicha" aria-label="Cerrar">&times;</button></div>'
    + '<div class="f-acc">'

/* ============================================================
   ASISTENTE. La key de la IA vive en el SERVIDOR de Munify
   (endpoint /api/public/calls/ia, con rate limit): antes habia
   que pegar una key de Groq POR NAVEGADOR y el dueño lo marco
   como friccion inaceptable (2026-08-28). La pagina le pega a
   /api same-origin, como cualquier app.

   Lo que la IA SI puede: preparar el pitch para ESE municipio,
   contestar una objecion, redactar el mail de seguimiento — con
   la ficha como contexto. Lo que NO: traer datos que no tenemos
   (quien es el intendente hoy). No tiene busqueda web y los
   inventaria; esos datos salen del relevamiento aparte.
   ============================================================ */
const IA_URL = '/api/public/calls/ia';
let iaChat = [];          // {rol, txt} de la conversacion abierta
let iaCargando = false;

function iaContexto(c){
  const f = FUNC[c.id] || {}, inv = INVEST[c.id] || {}, r = db[c.id] || {}, sp = SPEECH[c.pais] || {};
  const L = [];
  L.push('MUNICIPIO: ' + c.localidad + ' (' + c.region + ', ' + c.pais + '), ' + c.habitantes + ' habitantes.');
  if (c.perfil) L.push('PERFIL COMERCIAL: ' + c.perfil);
  if (f.intendente) L.push('AUTORIDAD: ' + f.intendente + ' — ' + (f.cargo || 'Intendente')
    + (f.partido ? ' (' + f.partido + ')' : '') + (f.nota ? '. OJO: ' + f.nota : ''));
  if (inv.estructura) L.push('AREAS DEL MUNICIPIO: ' + inv.estructura);
  if (inv.digital) L.push('NIVEL DE DIGITALIZACION: ' + inv.digital);
  if (inv.color) L.push('DATO DE COLOR: ' + inv.color);
  if (sp.angulo) L.push('ANGULO DE VENTA PARA ' + c.pais + ': ' + sp.angulo);
  if (sp.pulso) L.push('COMO PIENSA EL INTENDENTE DE ' + c.pais + ': ' + sp.pulso);
  if (r.notas) L.push('LO QUE ANOTE DE LA ULTIMA LLAMADA: ' + r.notas);
  if (r.quien) L.push('CON QUIEN HABLE: ' + r.quien);
  if (r.estado) L.push('ESTADO ACTUAL: ' + (LBL[r.estado] || r.estado));
  return L.join('\n');
}

const IA_SISTEMA = [
  'Sos el asistente de un vendedor argentino que ofrece Munify, una plataforma de gestion municipal',
  '(reclamos del vecino, tramites online, ordenes de trabajo de cuadrillas y tablero para el intendente)',
  'a municipios de Argentina, Paraguay, Peru y Uruguay.',
  'Te paso la ficha del municipio que esta por llamar. Contesta CORTO y accionable, en espanol rioplatense,',
  'listo para decir por telefono. Nada de listas largas ni palabreria.',
  'REGLA INVIOLABLE: no inventes datos del municipio que no esten en la ficha —ni nombres de funcionarios,',
  'ni cifras, ni obras, ni fechas—. Si te preguntan algo que la ficha no dice, deci que no lo sabes y que',
  'conviene verificarlo. Un dato inventado dicho en una llamada a un intendente es un papelon irreparable.'
].join(' ');

const IA_SUGERENCIAS = [
  'Armame el arranque de la llamada para este municipio',
  'Me dicen que ya tienen un sistema de reclamos, \u00bfqu\u00e9 les contesto?',
  'Me dicen que no hay presupuesto, \u00bfqu\u00e9 les contesto?',

  '\u00bfQu\u00e9 le pregunto para saber si vale la pena insistir?'
];

function iaPintar(c){
  const cont = document.getElementById('iaMsgs'); if (!cont) return;
  if (!iaChat.length){
    cont.innerHTML = '<div class="ia-msg ia">Tengo la ficha de <b>' + esc(c.localidad) + '</b> a mano. '
      + 'Preguntame c\u00f3mo encarar la llamada, c\u00f3mo contestar una objeci\u00f3n o pedime el mail de seguimiento.</div>';
  } else {
    cont.innerHTML = iaChat.map(m => '<div class="ia-msg ' + m.rol + '">' + esc(m.txt) + '</div>').join('');
  }
  if (iaCargando) cont.innerHTML += '<div class="ia-msg ia">Pensando...</div>';
  cont.scrollTop = cont.scrollHeight;
}

async function iaPreguntar(c, texto){
  if (!texto || iaCargando) return;
  iaChat.push({rol:'yo', txt:texto});
  iaCargando = true; iaPintar(c);
  try {
    // El historial que viaja se recorta a lo ultimo: el contexto pesado (la
    // ficha) va una sola vez en el system y el endpoint tiene tope de tamaño.
    const mensajes = [{role:'system', content: IA_SISTEMA + '\n\nFICHA DEL MUNICIPIO:\n' + iaContexto(c)}]
      .concat(iaChat.slice(-12).map(m => ({role: m.rol === 'yo' ? 'user' : 'assistant', content: m.txt})));
    const res = await fetch(IA_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mensajes}),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
    const txt = String(j.respuesta || '').trim();
    iaChat.push({rol:'ia', txt: txt || 'Vino una respuesta vacia. Proba de nuevo.'});
  } catch(err){
    iaChat.push({rol:'err', txt: 'No pude preguntarle a la IA: ' + err.message});
  }
  iaCargando = false; iaPintar(c);
}

function iaMontar(c){
  iaChat = []; iaCargando = false;
  const cont = document.getElementById('iaBox'); if (!cont) return;
  cont.innerHTML =
      '<div class="ia-msgs" id="iaMsgs"></div>'
    + '<div class="ia-sug" id="iaSug">' + IA_SUGERENCIAS.map((s, i) =>
        '<button data-i="' + i + '">' + esc(s) + '</button>').join('') + '</div>'
    + '<div class="ia-input"><input id="iaInp" placeholder="Preguntale algo sobre esta llamada..." autocomplete="off">'
    + '<button class="btn p" id="iaEnviar">Preguntar</button></div>'
    + '<div class="ia-nota">Responde con la ficha de este municipio como contexto. No conoce datos actuales del municipio '
    + '(quien es el intendente hoy, obras, cifras): eso sale del relevamiento, no de la IA.</div>';
  iaPintar(c);
  document.getElementById('iaSug').querySelectorAll('button').forEach(b =>
    b.onclick = () => iaPreguntar(c, IA_SUGERENCIAS[b.dataset.i]));
  const inp = document.getElementById('iaInp');
  const mandar = () => { const t = inp.value.trim(); inp.value = ''; iaPreguntar(c, t); };
  document.getElementById('iaEnviar').onclick = mandar;
  inp.onkeydown = e => { if (e.key === 'Enter') mandar(); };
}

/* El WhatsApp se guarda apenas se tipea: si la llamada se corta, el numero no
   se pierde. El aviso se rearma con lo ultimo escrito. */
function wireWa(){
  const c = FICHA.c, f = FICHA.f, id = FICHA.id;
  const iwa = document.getElementById('pWa'), bav = document.getElementById('pAvisar');
  function armar(){
    const num = (iwa.value || '').replace(/[^\d+]/g, '');
    bav.setAttribute('aria-disabled', num.length < 8 ? 'true' : 'false');
    const txt = POSTA.nombre + ', te paso una posta.\n\n'
      + (f.intendente ? f.intendente + ' \u2014 ' + (f.cargo || 'intendente') + ' de ' : 'Intendente de ')
      + c.localidad + ' (' + c.region + ', ' + c.pais + ')\n'
      + 'WhatsApp: ' + num + '\n\n'
      + 'Est\u00e1 interesado. Qued\u00f3 en que lo contact\u00e1s vos.';
    bav.href = 'https://wa.me/' + POSTA.wa + '?text=' + encodeURIComponent(txt);
  }
  iwa.oninput = () => {
    const rr = reg(id); rr.wa = iwa.value.trim(); guardar(); armar();
    /* La marca en la barra se prende sola: al cerrar el modal ya se ve que
       esa llamada dejo el numero. */
    const bt = document.querySelector('.f-acc .a-wa');
    if (bt) bt.classList.toggle('hecho', !!rr.wa);
  };
  bav.onclick = () => {
    if (bav.getAttribute('aria-disabled') === 'true') return;
    const rr = reg(id);
    rr.hist.push({t:new Date().toISOString(), tipo:'nota',
                  txt:'Posta pasada a ' + POSTA.nombre + ' (' + (rr.wa||'') + ')'});
    guardar(); pintarHist();
  };
  armar();
}

function wireLink(){
  const c = FICHA.c, cie = FICHA.cie;
  const bl = document.getElementById('pCopiarLink');
  if (bl) bl.onclick = () => copiar(urlDemo(c), 'pCopiarLink', 'Copiar link');
  // El cierre se copia CON el link adentro: el speech promete "te paso un link"
  // y sin eso quien vende se queda con la frase y sin nada que pegar.
  const bc = document.getElementById('pCopiarCierre');
  if (bc) bc.onclick = () => copiar(
    cie.link + '\n\n' + urlDemo(c) + '\n\n' + cie.duda,

function copiar(txt, btnId, orig){
  const b = document.getElementById(btnId);
  const fin = () => { if(b){ b.textContent = 'Copiado'; setTimeout(() => b.textContent = orig, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fin).catch(fin);
  else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
         try { document.execCommand('copy'); } catch(e){} document.body.removeChild(t); fin(); }
}
/* Los estados como PILDORAS en la topbar (dueño, 2026-08-30). Antes eran tres
   numeros informativos arriba y un combo de seis opciones abajo: el mismo dato
   contado dos veces, y para filtrar habia que abrir un desplegable. Ahora la
   pildora ES el filtro y muestra su numero. Se tocan, no se despliegan. */
const F_ESTADOS = [
  {id:'',           lbl:'Todos',     corto:'Todos', cl:''},
  {id:'pend',       lbl:'Sin llamar',corto:'Sin llamar', cl:'warn'},
  {id:'contactado', lbl:'Contactado',corto:'Contact.', cl:'ok'},
  {id:'no-atiende', lbl:'No atiende',corto:'No atiende', cl:'warn'},
  {id:'rellamar',   lbl:'Volver a llamar', corto:'Rellamar', cl:'pu'},
  {id:'descartado', lbl:'Descartado',corto:'Descart.', cl:'bad'}
];
function contarEstado(id, base){
  const arr = base || CONTACTOS;
  return id === '' ? arr.length
    : id === 'pend' ? arr.filter(c => !((db[c.id]||{}).estado)).length
    : arr.filter(c => (db[c.id]||{}).estado === id).length;
}
function pintarKpis(){
  const caja = document.getElementById('kpis'); if (!caja) return;
  const corto = angosto();
  /* Los que estan en cero no ocupan lugar en la barra — salvo el activo, que
     tiene que seguir viendose para poder salir del filtro. */
  caja.innerHTML = F_ESTADOS.filter(e => e.id === '' || e.id === fEstado || contarEstado(e.id))
    .map(e => '<button type="button" class="kpi' + (e.cl ? ' ' + e.cl : '')
      + (fEstado === e.id ? ' on' : '') + '" data-fe="' + e.id + '">'
      + esc(corto ? e.corto : e.lbl) + ' <b>' + contarEstado(e.id) + '</b></button>').join('');
  caja.querySelectorAll('[data-fe]').forEach(b => b.onclick = () => {
    fEstado = (fEstado === b.dataset.fe) ? '' : b.dataset.fe;
    tope = 25;
    // Filtrar desde "Hoy" no tendria donde verse: la lista vive en Trabajar.
    if (vista !== 'ops') irA('ops');
    else { pintarKpis(); pintarFiltros(); pintarLista(); }
  });
}
function pintarPie(){
  const n = CONTACTOS.length, hechos = n - pendientes().length;
  const pct = n ? Math.round(hechos*100/n) : 0;
  document.getElementById('pieBar').style.width = pct + '%';
  document.getElementById('pieTxt').textContent = hechos + ' de ' + n + ' gestionados (' + pct + '%)';
}
function pintar(){ const cs = CONTACTOS.find(x => x.id === selId); pintarModulos(cs); pintarDatoColor(cs); pintarKpis(); pintarPie(); pintarHoy(); if (vista === 'ops'){ pintarFiltros(); pintarLista(); } }
function irA(v){
  vista = v;
  // El CSS necesita saber en que vista estamos: "Trabajar" usa el modo
  // pantalla-completa (cada columna scrollea sola) y "Hoy" el scroll normal.
  document.body.dataset.vista = v;
  document.getElementById('vHoy').style.display = v === 'hoy' ? '' : 'none';
  document.getElementById('vOps').style.display = v === 'ops' ? '' : 'none';
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  // Las pildoras viven en la topbar, que es la MISMA en las dos vistas: si no
  // se repintan al cambiar, la activa queda mintiendo sobre el filtro puesto.
  pintarKpis();
  try { localStorage.setItem(KEY_VISTA, v); } catch(e){}
  if (v === 'ops'){ pintarFiltros(); pintarLista(); if (!selId) fichaVacia(); }
  // El shell es fijo: quien scrollea es el contenedor, no la ventana.
  const cont = document.querySelector('.app-scroll');
  if (cont) cont.scrollTop = 0;
  document.querySelectorAll('.ops-col').forEach(c => { c.scrollTop = 0; });
}
document.querySelectorAll('#switch button').forEach(b => b.onclick = () => irA(b.dataset.v));
document.getElementById('q').oninput = e => { q = e.target.value; tope = 25; pintarLista(); };
document.getElementById('ov').onclick = cerrarFicha;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarFicha();
  if (e.key === 'Tab' && e.altKey){ e.preventDefault(); irA(vista === 'hoy' ? 'ops' : 'hoy'); }
});

const LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
function aplicarTema(t){
  document.documentElement.setAttribute('data-tema', t);
  const b = document.getElementById('btnTema');
  b.innerHTML = t === 'claro' ? SOL : LUNA;
  b.title = t === 'claro' ? 'Volver al modo oscuro' : 'Pasar al modo claro';
  b.setAttribute('aria-label', b.title);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'claro' ? '#f4f6f9' : '#0f1720');
  try { localStorage.setItem(KEY_TEMA, t); } catch(e){}
}
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'llamados-munify-' + hoyISO() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { db = JSON.parse(rd.result) || {}; guardar(); pintar(); } catch(err){ alert('El archivo no se pudo leer'); } };
  rd.readAsText(f);
};

/* ============================================================
   RECORDATORIOS (Web Push) — tres por dia: manana, mediodia y tarde.
   El servidor los manda (endpoints /api/public/calls/push/*), asi llegan
   con la PWA CERRADA — en iPhone es la unica via, y exige que la app este
   instalada en la pantalla de inicio.

   El progreso vive en el localStorage de este navegador, asi que se REPORTA
   al servidor cada vez que cambia: sin eso el recordatorio de la tarde no
   podria decir "te faltan 3".
   ============================================================ */
const KEY_SUB = 'munify_llamados_push_endpoint';
const PUSH_URL = '/api/public/calls/push';
const hayPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;

function subGuardada(){ try { return localStorage.getItem(KEY_SUB) || ''; } catch(e){ return ''; } }
function b64ToU8(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function datosSub(sub){
  const j = sub.toJSON();
  return {endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
          user_agent: navigator.userAgent.slice(0, 400)};
}
function pintarBtnNotif(){
  const b = document.getElementById('btnNotif'); if (!b) return;
  if (!hayPush){ b.style.display = 'none'; return; }
  const on = !!subGuardada() && Notification.permission === 'granted';
  b.style.display = '';
  b.classList.toggle('on', on);
  b.title = on ? 'Recordatorios activados — tocá para desactivarlos'
               : 'Activar los recordatorios del día';
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="m3 3 18 18"/></svg>';
}
/* Lo que el servidor necesita para redactar el recordatorio: como viene el dia
   y a quien le toca. Se manda solo si cambio algo (nada de spamear). */
let ultimoReporte = '';
async function reportarProgreso(){
  const ep = subGuardada(); if (!ep) return;
  const prox = siguienteSugerido();
  const cuerpo = {endpoint: ep, hechas: llamadasDeHoy(), meta: metaDiaria(),
                  proximo: prox ? prox.localidad : null};
  const firma = JSON.stringify(cuerpo);
  if (firma === ultimoReporte) return;
  ultimoReporte = firma;
  try {
    await fetch(PUSH_URL + '/progreso', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: firma});
  } catch(e){ /* sin red el recordatorio usa el ultimo progreso conocido */ }
}
async function activarNotif(){
  if (!hayPush){ alert('Este navegador no soporta recordatorios.'); return; }
  // iOS exige la app INSTALADA (pantalla de inicio) para permitir push.
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (iOS && !instalada){
    alert('En iPhone hay que instalar la app primero: tocá Compartir y después "Agregar a inicio". Desde ahí se activan los recordatorios.');
    return;
  }
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted'){ alert('Sin permiso de notificaciones no puedo recordarte nada.'); return; }
    swReg = swReg || await navigator.serviceWorker.register('/calls/sw.js', {scope:'/calls/'});
    await navigator.serviceWorker.ready;
    const r = await fetch(PUSH_URL + '/clave');
    const {clave} = await r.json();
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: b64ToU8(clave)});
    const datos = datosSub(sub);
    await fetch(PUSH_URL + '/suscribir', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos)});
    try { localStorage.setItem(KEY_SUB, datos.endpoint); } catch(e){}
    pintarBtnNotif();
    ultimoReporte = ''; await reportarProgreso();
    // Una de prueba al toque: activar no puede ser un acto de fe hasta mañana.
    await fetch(PUSH_URL + '/probar', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos)});
  } catch(err){
    alert('No pude activar los recordatorios: ' + (err && err.message ? err.message : err));
  }
}
async function desactivarNotif(){
  try {
    const reg = swReg || await navigator.serviceWorker.getRegistration('/calls/');
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub){
      await fetch(PUSH_URL + '/baja', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(datosSub(sub))});
      await sub.unsubscribe();
    }
  } catch(e){ /* igual se olvida local */ }
  try { localStorage.removeItem(KEY_SUB); } catch(e){}
  pintarBtnNotif();
}

/* ============================================================
   ANTI-ZOOM en iOS. Safari ignora `user-scalable=no` desde iOS 10, asi que
   una PWA instalada se pellizca y se hace doble-tap como una pagina web
   cualquiera (reporte del dueño, 2026-08-28). Los eventos `gesture*` son la
   unica via que respeta: se cancelan los tres. El doble-tap se corta con el
   `touch-action:manipulation` del CSS y, para lo que quede fuera, con el
   guard de los 300 ms de abajo.
   ============================================================ */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* Al girar el telefono o cambiar de ventana, los labels se re-evaluan: lo que
   se abrevia en angosto vuelve completo en ancho. Un control "responsivo" que
   solo se adapta en la carga no es responsivo. */
let _t = null;
window.addEventListener('resize', () => {
  clearTimeout(_t);
  _t = setTimeout(() => { if (vista === 'ops') pintarFiltros(); }, 180);
});
let ultimoTap = 0;
document.addEventListener('touchend', (e) => {
  const ahora = Date.now();
  if (ahora - ultimoTap < 300) e.preventDefault();   // segundo toque = zoom
  ultimoTap = ahora;
}, { passive: false });

(function init(){
  let t = null; try { t = localStorage.getItem(KEY_TEMA); } catch(e){}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'oscuro';
  aplicarTema(t);
  document.getElementById('btnTema').onclick = () =>
    aplicarTema(document.documentElement.getAttribute('data-tema') === 'claro' ? 'oscuro' : 'claro');
  // Recordatorios: el SW se registra siempre (para que la PWA sea instalable);
  // el permiso y la suscripcion solo con el boton.
  if (hayPush){
    navigator.serviceWorker.register('/calls/sw.js', {scope:'/calls/'})
      .then(r => { swReg = r; }).catch(() => {});
    const b = document.getElementById('btnNotif');
    if (b) b.onclick = () => (subGuardada() ? desactivarNotif() : activarNotif());
  }
  pintarBtnNotif();
  try { paisHoy = localStorage.getItem(KEY_PAIS) || ''; } catch(e){}
  let v = null; try { v = localStorage.getItem(KEY_VISTA); } catch(e){}
  /* En el telefono la vista Hoy se plegaba sola: se deja abierto lo urgente
     (lo que prometiste devolver, si hay) y el resto se abre a pedido. */
  if (window.matchMedia('(max-width: 1000px)').matches){
    document.querySelectorAll('#vHoy details.tarj').forEach(d => {
      const esAgenda = !!d.querySelector('#agenda');
      d.open = esAgenda && agendados().length > 0;
    });
  }
  pintar();
  irA(v === 'ops' ? 'ops' : 'hoy');
})();
</script>
