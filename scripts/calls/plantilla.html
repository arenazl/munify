<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llamados">
<title>Llamados Munify</title>
<link rel="manifest" href="/calls/manifest.json">
<link rel="apple-touch-icon" href="/calls/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap">
<style>
:root{
 --bg:#0f1720; --bg2:#141e2a; --card:#1a2635; --card2:#213040; --line:#2b3b4e; --line2:#3a4c62;
 --ink:#e8eef6; --ink2:#9db0c6; --ink3:#6d829c;
 --acc:#3d8bfd; --acc2:#2f6fd0; --acc-soft:#1b2c45;
 --ok:#35c07f; --warn:#e2a33c; --bad:#e06c6c; --purple:#9a7bdc;
 --r:12px;
 /* La display de los heroes semanticos de la app (--pl-font-display = Sora):
    los titulos de seccion hablan el mismo idioma que el resto de Munify. */
 --font-display:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root[data-tema="claro"]{
 --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f7; --line:#dfe5ec; --line2:#c8d2de;
 --ink:#16212e; --ink2:#4d5f75; --ink3:#7c8ca1;
 --acc:#2f6fd0; --acc2:#245ab0; --acc-soft:#e5eefb;
 --ok:#1e9e63; --warn:#b57611; --bad:#c94a4a; --purple:#7357bd;
}
:root[data-tema="claro"] header.top,:root[data-tema="claro"] footer.pie{background:rgba(244,246,249,.97)}
:root[data-tema="claro"] .row,:root[data-tema="claro"] .tarj,:root[data-tema="claro"] .ficha{box-shadow:0 1px 2px rgba(20,34,51,.05)}
:root[data-tema="claro"] .eb.on[data-e=contactado],:root[data-tema="claro"] .eb.on[data-e=no-atiende]{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* APP-SHELL 100% FIJO (regla del dueño, 2026-08-28, estandar 11 de
   base-compartida): html/body clavados al viewport y SIN scroll propio —
   scrollea SOLO .app-scroll (y los paneles internos controlados). Es lo que
   hace que la PWA no se "vaya a los costados" ni rebote como pagina web. */
html,body{margin:0;padding:0;width:100%;height:100%;max-width:100%;overflow:hidden;
 overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 touch-action:pan-y;display:flex;flex-direction:column}
/* iOS ignora `user-scalable=no` desde iOS 10: el zoom por pellizco y por
   doble-tap se corta con touch-action + los eventos `gesture*` de Safari
   (ver el bloque anti-zoom del script). Sin esto, una PWA se pellizca como
   una pagina web cualquiera — que es justo lo que el dueño reporto. */
button,a,input,select,textarea,.row,.cola-it,.ag-it,.eb,.chip,.pchip{touch-action:manipulation}
.app-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y}
.paises,.kpis{touch-action:pan-x pan-y}
input,textarea,select,button{font-family:inherit;font-size:16px}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px 16px;width:100%}

header.top{flex:none;z-index:40;background:rgba(15,23,32,.96);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding-top:max(env(safe-area-inset-top),8px)}
/* BARRA DE APP: UNA SOLA FILA, SIEMPRE. `flex-wrap:wrap` aca es un bug, no una
   defensa: cuando falta ancho, el ultimo control cae solo a un segundo piso y
   se come el alto util de la pantalla (le paso al dueño en un iPhone 17 Pro,
   2026-08-28). Lo correcto es que los controles se COMPRIMAN: el titulo cede
   ancho (ellipsis), el resto conserva su tamaño y nada envuelve. */
.top-in{max-width:1400px;margin:0 auto;padding:0 14px 10px;display:flex;align-items:center;
 gap:10px;flex-wrap:nowrap;min-width:0}
/* El unico que cede ancho: el isotipo nunca se achica, el texto se corta si
   hace falta (y en pantallas muy angostas desaparece — ver la media query). */
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px;font-size:17px;
 flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.brand .txt{overflow:hidden;text-overflow:ellipsis}
/* El isotipo REAL de Munify (mismo SVG que favicon.svg de la app). Va sobre
   un cuadradito claro para que el marino se lea igual en tema oscuro. */
.brand i{width:26px;height:26px;border-radius:7px;background:#fff;display:grid;place-items:center;
 font-style:normal;flex:none;box-shadow:0 0 0 1px rgba(17,42,108,.12)}
.brand i svg{width:17px;height:17px;display:block}
.spacer{flex:1 1 0;min-width:0}
/* Los controles de la barra conservan su tamaño: son destinos de toque, no
   texto. Achicarlos rompe el area minima de 34px. */
.switch,.tema,.kpis{flex:0 0 auto}
.switch{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.switch button{border:0;background:transparent;color:var(--ink2);border-radius:999px;padding:6px 15px;
 cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.switch button.on{background:var(--acc);color:#fff}
.switch button:hover:not(.on){color:var(--ink)}
.tema{background:var(--card);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;width:34px;height:34px;
 cursor:pointer;display:grid;place-items:center;flex:none;transition:.12s;padding:0}
.tema:hover{border-color:var(--acc);color:var(--acc)}
.tema.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.tema svg{width:17px;height:17px;display:block}
.kpis{display:flex;gap:7px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.kpi b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.pu b{color:var(--purple)}

.hoy-grid{display:grid;grid-template-columns:1.25fr .95fr;gap:13px;margin-top:14px}
.big{background:linear-gradient(140deg,var(--acc),var(--purple));border-radius:14px;padding:20px;color:#fff}
.big .k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;opacity:.88;font-weight:700}
.big h2{font-size:32px;font-weight:800;line-height:1.05;margin:7px 0 3px;letter-spacing:-.6px}
.big .s{font-size:13.5px;opacity:.93;line-height:1.5}
.big .s b{font-weight:700}
.big .acciones{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.big a.bl{background:#fff;color:var(--acc2);border:0;border-radius:9px;padding:11px 16px;
 font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums}
.big button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:9px;
 padding:11px 15px;font-weight:600;font-size:14px;cursor:pointer}

.hoy-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.hoy-top .tit{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-right:4px}
.paises{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 13px;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap;font-weight:600}
.pchip:hover{border-color:var(--acc);color:var(--ink)}
.pchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pchip .n{opacity:.72;font-size:11px;margin-left:5px;font-weight:500}
.meta-dia{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:13px}
.meta-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.meta-top .n{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.meta-top .de{font-size:13px;color:var(--ink3)}
.meta-top .frase{margin-left:auto;font-size:13px;color:var(--ink2);text-align:right}
.meta-top .frase b{color:var(--ink)}
.pasos{display:flex;gap:5px}
.pasos i{flex:1;height:8px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.pasos i.ok{background:var(--ok);border-color:var(--ok)}
.pasos i.hoy{background:var(--acc);border-color:var(--acc)}
.meta-cfg{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink3)}
.meta-cfg input{width:54px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;
 padding:4px 8px;color:var(--ink);text-align:center;font-size:13px;font-weight:700}
.cola-hoy{display:grid;gap:7px}
.cola-it{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:8px 10px;
 background:var(--card2);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.cola-it:hover{border-color:var(--acc)}
.cola-it .pos{font-size:12px;color:var(--ink3);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cola-it .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cola-it .sb{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cola-it .why{color:var(--acc);font-weight:600}

.ia-btn{background:linear-gradient(135deg,var(--purple),var(--acc));color:#fff;border:0;border-radius:9px;
 padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ia-btn:hover{filter:brightness(1.08)}
.ia-btn svg{width:15px;height:15px}
.ia-wrap{margin-top:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card2);overflow:hidden}
.ia-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);
 font:700 14px/1.25 var(--font-display);letter-spacing:-.2px;color:var(--ink)}
.ia-msgs{display:grid;gap:8px;padding:12px 13px;max-height:320px;overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y}
.ia-msg{font-size:13.5px;line-height:1.6;padding:10px 12px;border-radius:10px;white-space:pre-wrap}
.ia-msg.yo{background:var(--acc-soft);border:1px solid var(--acc);color:var(--ink);margin-left:22px}
.ia-msg.ia{background:var(--card);border:1px solid var(--line);color:var(--ink2);margin-right:22px}
.ia-msg.err{background:var(--card);border:1px solid var(--bad);color:var(--bad)}
.ia-sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 13px 11px}
.ia-sug button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 11px;font-size:12px;cursor:pointer;text-align:left}
.ia-sug button:hover{border-color:var(--purple);color:var(--ink)}
.ia-input{display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--line)}
.ia-input input{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:9px;
 padding:9px 12px;color:var(--ink);outline:none;font-size:14px}
.ia-input input:focus{border-color:var(--purple)}
.ia-nota{font-size:11.5px;color:var(--ink3);padding:0 13px 11px;line-height:1.5}
/* La chuleta de modulos. Densa a proposito: entra en 270px y se lee de reojo. */
.mods{display:flex;flex-direction:column;gap:5px}
.mod{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card2)}
.mod .mod-h{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:8px 10px;
 display:flex;gap:8px;align-items:flex-start;color:inherit;font:inherit}
.mod .mod-h:hover{background:var(--card)}
.mod .ic{flex:0 0 15px;height:15px;margin-top:1px}
.mod .ic svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round}
.mod .tx{flex:1;min-width:0}
.mod .tx b{display:block;font:700 12.5px var(--font-disp);letter-spacing:-.1px}
.mod .tx i{display:block;font-style:normal;font-size:11.5px;line-height:1.4;color:var(--ink2);margin-top:2px}
.mod .car{flex:0 0 10px;height:10px;margin-top:4px;transition:transform .18s}
.mod .car svg{width:10px;height:10px;stroke:var(--ink3);fill:none;stroke-width:2.6;
 stroke-linecap:round;stroke-linejoin:round}
.mod.on .car{transform:rotate(90deg)}
.mod-c{display:none;padding:0 10px 10px}
.mod.on .mod-c{display:block}
.mod ul{margin:0;padding:0 0 0 22px;list-style:none}
.mod li{position:relative;font-size:11.8px;line-height:1.45;color:var(--ink2);padding:3px 0 3px 11px}
.mod li:before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;
 border-radius:99px;background:var(--acc)}
.mod li b{color:var(--ink);font-weight:700}
.tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tarj h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:700 14px/1.25 var(--font-display);
 letter-spacing:-.2px;color:var(--ink)}
.ag-it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ag-it:last-child{border-bottom:none}
.ag-it:hover .ag-nom{color:var(--acc)}
.ag-nom{font-weight:650;font-size:14px}
.fecha{font-size:11.5px;background:var(--card2);color:var(--ink2);border-radius:6px;padding:3px 8px;
 white-space:nowrap;font-weight:600;border:1px solid var(--line2)}
.fecha.hoy{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.paisrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.paisrow .nm{width:78px;color:var(--ink2);font-weight:600;flex:none}
.barra{flex:1;height:7px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .3s}
.paisrow .num{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;width:54px;text-align:right;flex:none}
.resumen{font-size:13.5px;color:var(--ink2);line-height:1.6;border-top:1px solid var(--line);margin-top:11px;padding-top:11px}
.resumen b{color:var(--ink)}

/* VISTA "TRABAJAR": tres columnas que ocupan el alto y scrollean CADA UNA.
   Antes vivian de `position:sticky; top:112px` + `max-height:calc(100vh-132px)`,
   que dependian de que el header estuviera EN EL FLUJO. Con el app-shell fijo
   el header salio del flujo y esas reglas quedaron mintiendo: scrolleaba solo
   la lista (que tenia overflow propio) y la ficha y la columna derecha
   quedaban muertas (reporte del dueño, 2026-08-28). Ahora el alto lo pone el
   shell y cada columna es su propio scroller. */
.ops{display:grid;grid-template-columns:335px minmax(0,1fr) 285px;gap:13px;
 margin-top:14px;align-items:stretch;min-height:0}
/* Tablet en horizontal (y ventanas angostas de escritorio): la columna
   auxiliar se va y quedan lista + ficha, que es lo que se trabaja. Antes
   estas anchuras entraban a la fuerza y apretaban la ficha. */
/* TABLET (1001-1300): las tres columnas ENTRAN, con un zoom de 0.8. Es lo que
   el dueno hacia a mano en su tablet de 1080px. Antes se escondia la tercera y
   con ella se iban "Lo que viene", "Recordar" y "Avance": una tablet de 11"
   quedaba PEOR que un telefono, que al menos las apila.
   El zoom va en .wrap y no en el body: el body fija el alto de la ventana. */
@media(min-width:1001px) and (max-width:1300px){
  .wrap{zoom:.8}
  .ops{grid-template-columns:320px minmax(0,1fr) 270px}
  .extra{display:block}
}
@supports not (zoom: 1){
  @media(min-width:1001px) and (max-width:1300px){
    .wrap{transform:scale(.8);transform-origin:top center;width:125%;margin-left:-12.5%}
  }
}
.f-body{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.extra{overscroll-behavior:contain;touch-action:pan-y}
/* EL CIERRE — el bloque que remata la llamada. Va marcado aparte del speech
   a proposito: el speech es para ABRIR y esto es para CERRAR, y quien llama no
   es el dueno del producto sino alguien contratado. Tiene que saltar a la vista
   en el momento en que la charla se pone buena. */
/* El boton que crea la demo EN VIVO, durante la llamada. Va arriba del cierre
   y pesa visualmente: es la accion que convierte la charla en una demostracion. */
/* Pasar la posta: el WhatsApp del prospecto y el aviso a quien sigue. */
/* El link que se le manda al intendente: visible, copiable y corto. */
.lnk{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;
 border:1px dashed var(--acc);border-radius:9px;background:var(--bg2)}
.lnk code{flex:1;min-width:0;font:500 11.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
 color:var(--acc);overflow-wrap:anywhere}
.lnk .cp{flex:0 0 auto;background:var(--acc);color:#fff;border:0;border-radius:7px;
 padding:6px 10px;font:700 11px var(--font-disp);cursor:pointer;white-space:nowrap}
.hoff{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--bg2)}
.hoff .t{font:700 12px var(--font-disp);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.hoff .t svg{width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:2}
.hoff .fila{display:flex;gap:7px}
.hoff input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
 font:400 14px var(--font);background:var(--card);color:var(--ink)}
.hoff input:focus{outline:none;border-color:var(--ok)}
.hoff .av{flex:0 0 auto;background:var(--ok);color:#fff;border:0;border-radius:9px;padding:9px 13px;
 font:700 12.5px var(--font-disp);cursor:pointer;white-space:nowrap;text-decoration:none;
 display:inline-flex;align-items:center;gap:6px}
.hoff .av[aria-disabled="true"]{opacity:.42;pointer-events:none}
.hoff .ay{margin-top:7px;font:400 11.5px/1.45 var(--font);color:var(--ink2)}
.hoff .ay b{color:var(--ink)}
.demo-btn{display:flex;align-items:center;gap:9px;width:100%;justify-content:center;
 background:var(--acc);color:#fff;border:0;border-radius:var(--r);padding:12px 14px;
 font:700 14px var(--font-disp);cursor:pointer;text-decoration:none;margin-bottom:10px}
.demo-btn:hover{filter:brightness(1.07)}
.demo-btn svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:2}
.demo-nota{font:400 11.5px/1.5 var(--font);color:var(--ink2);margin:-4px 0 12px;padding-left:2px}
.cierre-b{border:1px solid var(--ok);border-radius:var(--r);overflow:hidden;margin-top:2px}
.cierre-b > .cab{background:var(--ok);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;
 font:800 12px/1.2 var(--font-disp);letter-spacing:.04em;text-transform:uppercase}
.cierre-b > .cab .cuando{margin-left:auto;font:600 10px var(--font);text-transform:none;letter-spacing:0;opacity:.9}
.cierre-b .cuerpo{padding:12px}
.cierre-p{display:flex;gap:10px;margin-bottom:12px}
.cierre-p:last-child{margin-bottom:0}
.cierre-p .n{flex:0 0 20px;height:20px;border-radius:99px;background:var(--ok);color:#fff;
 display:flex;align-items:center;justify-content:center;font:800 11px var(--font-disp)}
.cierre-p .t{flex:1;min-width:0}
.cierre-p .t b{display:block;font:700 12.5px var(--font-disp);margin-bottom:3px}
.cierre-frase{background:var(--bg2);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;
 padding:9px 11px;font:400 13px/1.55 var(--font);color:var(--ink)}
.cierre-frase em{font-style:normal;background:rgba(16,163,74,.14);border-radius:3px;padding:0 3px}
.cierre-ojo{margin-top:11px;padding:9px 11px;border-radius:8px;background:rgba(220,38,38,.07);
 border:1px solid rgba(220,38,38,.25);font:400 12px/1.5 var(--font);color:var(--ink2)}
.cierre-ojo b{color:var(--bad)}
.ops-col{min-width:0;min-height:0}
.lista-col,.ficha-col,.extra{overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y}
.lista-col{padding-right:3px}
.extra{padding-right:3px}

/* Modo pantalla-completa de la vista Trabajar: el contenedor deja de
   scrollear y el alto baja por la cadena hasta las columnas. */
body[data-vista="ops"] .app-scroll{overflow:hidden}
body[data-vista="ops"] .wrap{height:100%;display:flex;flex-direction:column;padding-bottom:12px}
body[data-vista="ops"] #vOps{flex:1;min-height:0;display:flex;flex-direction:column}
body[data-vista="ops"] .ops{flex:1;min-height:0;margin-top:12px}
.filtros{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.chip{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip .n{opacity:.7;font-size:11px;margin-left:4px}
.buscar{flex:1;min-width:150px}
.buscar input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:999px;
 padding:8px 14px;color:var(--ink);outline:none}
.buscar input:focus{border-color:var(--acc)}

.controles{display:grid;gap:7px;margin-bottom:10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sel{position:relative}
/* padding-right 34: el chevron dibujado con :after ocupa lugar real. Con 28 el
   texto le pasaba por debajo y se leia "Todos los países (154" cortado. */
.sel select{width:100%;min-width:0;appearance:none;-webkit-appearance:none;background:var(--card);
 border:1px solid var(--line2);border-radius:9px;padding:8px 34px 8px 12px;color:var(--ink);
 font-size:13.5px;font-weight:600;cursor:pointer;outline:none;text-overflow:ellipsis}
.sel select:focus{border-color:var(--acc)}
.sel:after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
 border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-70%) rotate(45deg)}
.sel select option{background:var(--card);color:var(--ink)}
.conteo{font-size:12px;color:var(--ink3);padding:1px 3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.conteo b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:700}
.conteo .limpiar{margin-left:auto;color:var(--acc);cursor:pointer;font-weight:600}

/* ---- Paginado de la lista: nada de 154 filas de corrido ---- */
.mas{width:100%;margin-top:9px;border:1px dashed var(--line2);background:transparent;color:var(--ink2);
 border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer}
.mas:hover{border-color:var(--acc);color:var(--acc)}
.mas span{color:var(--ink3);font-weight:400}

/* ---- Tarjetas plegables (solo se pliegan en el telefono) ---- */
.tarj details{margin:0}
.tarj > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
 font:700 14px/1.25 var(--font-display);letter-spacing:-.2px;color:var(--ink)}
.tarj > summary::-webkit-details-marker{display:none}
.tarj > summary .flecha{margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink3);
 border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
.tarj[open] > summary .flecha{transform:rotate(-135deg)}
.tarj > summary .cuenta{background:var(--card2);border:1px solid var(--line);border-radius:999px;
 padding:1px 8px;font-size:11px;letter-spacing:0;color:var(--ink2);font-weight:700}
.tarj > summary + *{margin-top:10px}

@media(max-width:1000px){
  /* la barra de paises no envuelve: una linea que se desliza */
  .paises{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;
   scrollbar-width:none}
  .paises::-webkit-scrollbar{display:none}
  .hoy-top{margin-top:11px}
  .hoy-grid{gap:10px}
  .big{padding:16px}
  .big h2{font-size:25px}
  .big .acciones{margin-top:11px}
  .big a.bl,.big button.gh{padding:10px 13px;font-size:14px}
  .tarj{padding:11px 12px}
  .meta-dia{padding:11px 12px;margin-top:10px}
  .meta-top .n{font-size:23px}
  .meta-top .frase{margin-left:0;text-align:left;flex-basis:100%;font-size:12.5px}
  /* filas mas bajas: entran mas municipios sin scrollear tanto */
  .row{padding:9px 10px;gap:9px}
  .est{height:28px}
  .info h4{font-size:14px}
  .tel-btn{padding:7px 11px;font-size:12.5px}
  .controles{gap:6px;margin-bottom:9px}
  .hist{max-height:none}
}
.lista{display:grid;gap:7px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
 display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--line2);background:var(--card2)}
.row.sel{border-color:var(--acc);background:var(--acc-soft)}
.row.done{opacity:.62}
.est{width:6px;height:32px;border-radius:4px;background:var(--line2);flex:none}
.est.contactado{background:var(--ok)} .est.no-atiende{background:var(--warn)}
.est.rellamar{background:var(--purple)} .est.descartado{background:var(--bad)}
.info{min-width:0}
.info h4{margin:0 0 2px;font-size:14.5px;font-weight:700;letter-spacing:-.15px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink2);font-weight:600}
.tel-btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;text-decoration:none;
 border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tel-btn:hover{background:var(--acc2)}
.tel-btn.hecho{background:var(--card2);color:var(--ink2);border:1px solid var(--line2)}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);
 color:var(--ink3);margin-left:5px;vertical-align:1px}
.badge.n{border-color:var(--purple);color:var(--purple)}
.badge.ojo{border-color:var(--warn);color:var(--warn)}

.ficha{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;max-height:100%;
 touch-action:pan-y}
/* El cuerpo de la ficha SOLO va vertical, EN TODOS LOS ANCHOS (antes vivia
   solo en la media query mobile y el desktop quedaba sin la regla): un
   contenido apenas mas ancho (una URL larga) habilitaba el arrastre lateral
   adentro del panel aunque el shell estuviera clavado. */
.f-body{overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
.f-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.f-head>div{flex:1;min-width:0}
.f-head h2{margin:0 0 3px;font-size:23px;letter-spacing:-.4px}
.f-head .meta{font-size:13px;white-space:normal}
.f-body{padding:14px 16px 18px}
/* La barra de acciones: pegada bajo el titulo, siempre visible mientras se
   scrollea el libreto. Son las cuatro cosas que se TOCAN en una llamada. */
.f-acc{display:flex;gap:6px;padding:9px 16px;border-bottom:1px solid var(--line);
 background:var(--card);position:sticky;top:0;z-index:3}
.f-acc button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
 border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink2);
 padding:8px 4px;cursor:pointer;font:700 11px var(--font-disp);transition:.15s}
.f-acc button svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f-acc button:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-1px)}
.f-acc button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.f-acc .a-wa svg{stroke:var(--ok)} .f-acc .a-demo svg{stroke:var(--acc)}
.f-acc .a-cie svg{stroke:var(--warn)} .f-acc .a-ia svg{stroke:var(--purple)}
/* Marca cuando el WhatsApp ya se cargo: de un vistazo se sabe si esa llamada
   ya dejo la posta o no. */
.f-acc button.hecho{border-color:var(--ok);background:var(--ok-soft,var(--card2));color:var(--ink)}

/* Modal de accion. Vive fuera de la ficha (fixed) para no heredar su scroll. */
.fmod{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.fmod.on{display:flex}
.fmod .velo{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.fmod .caja{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
 width:min(560px,100%);max-height:min(92vh,860px);display:flex;flex-direction:column;
 box-shadow:0 24px 60px rgba(0,0,0,.4)}
.fmod .cab2{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line)}
.fmod .cab2 h3{margin:0;flex:1;min-width:0;font:800 16px var(--font-disp);letter-spacing:-.2px}
.fmod .cab2 .mu{font-size:12px;color:var(--ink3);white-space:nowrap}
.fmod .x{background:none;border:0;color:var(--ink3);font-size:24px;line-height:1;cursor:pointer;padding:0 2px}
/* La accion principal del modal no puede quedar abajo de todo ni encima del
   texto: pie propio, fuera de lo que scrollea. */
.fmod .pie3{padding:11px 15px;border-top:1px solid var(--line);background:var(--card);
 border-radius:0 0 16px 16px}
.fmod .pie3 .btn{width:100%;padding:11px;font-size:14px}
.fmod .cue{padding:14px 15px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(max-width:700px){
  /* Hoja anclada abajo: crece con su contenido, no pinta media pantalla en
     blanco, y deja los controles donde esta el pulgar. */
  .fmod{padding:0;align-items:flex-end}
  .fmod .caja{width:100%;max-height:92dvh;border-radius:16px 16px 0 0}
  /* El titulo no puede quedar abajo del reloj y la senal (doc 11). */
  .fmod .cab2{padding-top:max(env(safe-area-inset-top),13px)}
  /* Ni el pie abajo del borde inferior ni del indicador de gestos. */
  .fmod .pie3{padding-bottom:max(env(safe-area-inset-bottom),11px);border-radius:0}
  .fmod .cue{padding-bottom:max(env(safe-area-inset-bottom),20px)}
  .fmod .pie3 + .cue, .fmod .cue:has(+ .pie3){padding-bottom:20px}
}

.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
/* Titulos de seccion con IDENTIDAD (pedido del dueño, 2026-08-28): la Sora
   de los heroes, chiquita y con su marca de acento — un golpe de vista y ya
   sabes que viene, en lugar del microrotulo gris que hacia "panel panel". */
.sec>label{display:flex;align-items:center;gap:8px;font:700 15.5px/1.25 var(--font-display);
 letter-spacing:-.2px;color:var(--ink);margin-bottom:8px}
/* El iconito diferenciador de cada seccion (pedido del dueño): un pantallazo
   y ya sabes que informacion agrega el panel. SVG inline, color semantico. */
.sic{width:15px;height:15px;flex:none;display:inline-flex}
.sic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sic.a{color:var(--acc)} .sic.p{color:var(--purple)} .sic.o{color:var(--ok)}
.sic.w{color:var(--warn)} .sic.n{color:var(--ink3)}
/* Menos "panel panel panel" (dueño, 2026-08-28): el box PLANO deja de ser
   tarjeta — texto con un hairline a la izquierda, respira. Los que cargan
   SEMANTICA (script/perfil/dato/ojo) conservan su tarjeta tintada: son los
   que tienen que saltar a la vista. */
.box{background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;
 padding:2px 0 2px 13px;font-size:15px;color:var(--ink2);line-height:1.62;overflow-wrap:anywhere}
.box+.box{margin-top:9px}
.box.script,.box.perfil,.box.dato,.box.ojo{background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:11px 13px}
.box.script{border-left:3px solid var(--acc);color:var(--ink);font-size:15.5px;line-height:1.68}
.box.perfil{border-left:3px solid var(--purple)}
.box.dato{border-left:3px solid var(--ok)}
.box.ojo{border-left:3px solid var(--warn)}
.box b{color:var(--ink)}
/* LA NARRACION: parrafos separados, no un ladrillo. Por telefono se pierde
   el renglon si son cinco lineas seguidas (dueño, 2026-08-30). */
.box.script p{margin:0}
.box.script p+p{margin-top:10px}
/* Los cuatro TABS del guion (dueño, 2026-08-30): "una vez que le hiciste la
   introduccion, abajo aparece el detalle un poquito mas de cada modulo".
   Cerrados de arranque: el centro es la narracion y nada mas; se abre el que
   el otro pida. */
.g-hint{font-size:12.5px;color:var(--ink3);margin-bottom:9px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:9px;
 padding:9px 6px;cursor:pointer;font-size:12.5px;font-weight:700;transition:.12s;
 display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab:hover{border-color:var(--acc);color:var(--ink)}
.tab.on{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.g-txt{margin-top:9px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc);
 border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.66;color:var(--ink)}
.g-txt p{margin:0}
.g-txt p+p{margin-top:10px}
.g-txt b{color:var(--ink);font-weight:700}
.g-txt{position:relative}
.g-txt.otra{border-left-color:var(--purple)}
.g-re{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:8px;cursor:pointer;
 background:var(--card2);border:1px solid var(--line2);color:var(--ink3);display:flex;align-items:center;
 justify-content:center;transition:.14s}
.g-re svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.g-re:hover{border-color:var(--acc);color:var(--acc);transform:rotate(-45deg)}
.g-txt p{padding-right:30px}
.g-pie{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding-top:9px;
 border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
/* El boton que le pide a la IA el angulo de ESE modulo para ESTE municipio.
   Vive dentro del panel, debajo de los bullets fijos: primero lo que el
   modulo hace, despues por que le sirve a ellos. */
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--acc);font-size:11.5px;
 font-weight:700;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--ink)}
.mod-btn{margin-top:9px;display:inline-block}
.mod-c.gen .mod-btn{display:none}
.mod-txt{margin-top:9px;background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--acc);
 border-radius:9px;padding:10px 11px;font-size:12.3px;line-height:1.55;color:var(--ink)}
.mod-txt p{margin:0}
.mod-txt p+p{margin-top:8px}
.mod-txt.cargando,.mod-txt.error{color:var(--ink3);font-style:italic;border-left-color:var(--line2)}
.mod-txt.error{font-style:normal}
.mod-pie{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;padding-top:8px;
 border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}
@media(max-width:420px){ .tabs{grid-template-columns:repeat(2,1fr)} }
/* DATO DE COLOR (columna derecha): lo que se sabe ANTES de marcar. Vivia en el
   centro y empujaba la narracion fuera de la pantalla (dueño, 2026-08-30). */
.color-box{display:flex;flex-direction:column;gap:7px}
.co{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.co-h{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--ink3);font-weight:700;margin-bottom:5px}
.co-ic{width:13px;height:13px;flex:none;display:inline-flex;color:var(--ink3)}
.co-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.co-b{font-size:12.3px;line-height:1.5;color:var(--ink2)}
.co.jefe .co-ic{color:var(--acc)} .co.perfil .co-ic{color:var(--purple)}
.co.hielo .co-ic{color:var(--ok)} .co.digital .co-ic{color:var(--warn)}
.co .n{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.25}
.co .s{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.co a{color:var(--acc);overflow-wrap:anywhere}
/* Seis lineas y corta: en la columna se barre de un vistazo, no se lee. */
.co p.rec{margin:0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.co p.rec.todo{-webkit-line-clamp:unset;overflow:visible}
.co-mas{margin-top:5px}
/* El veredicto comercial de un vistazo: contra que competimos en este lugar. */
.ver{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:999px;
 padding:3px 9px;margin-bottom:7px;border:1px solid}
.ver:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ver.compite{color:var(--bad);border-color:var(--bad)}
.ver.parcial{color:var(--warn);border-color:var(--warn)}
.ver.virgen{color:var(--ok);border-color:var(--ok)}
.ver.nada{color:var(--ink3);border-color:var(--line2)}
/* Los canales que ya tienen, dibujados: se ve el terreno sin leer el parrafo. */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink2);
 background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:3px 7px}
.chip svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-tel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.p-tel a.tel-btn{flex:1;justify-content:center;font-size:16px;padding:13px}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:9px;padding:9px 13px;
 cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.estados{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px}
.eb{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:9px;padding:10px 8px;
 cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:.12s}
.eb:hover{border-color:var(--ink3)}
.eb.on[data-e=contactado]{background:var(--ok);border-color:var(--ok);color:#04240f}
.eb.on[data-e=no-atiende]{background:var(--warn);border-color:var(--warn);color:#1a1200}
.eb.on[data-e=rellamar]{background:var(--purple);border-color:var(--purple);color:#fff}
.eb.on[data-e=descartado]{background:var(--bad);border-color:var(--bad);color:#fff}
textarea,input.f{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:10px;
 padding:11px 12px;color:var(--ink);outline:none;resize:vertical;line-height:1.55}
textarea:focus,input.f:focus{border-color:var(--acc)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hist{display:grid;gap:6px;max-height:300px;overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y}
.h-it{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--ink2)}
.h-it time{color:var(--ink3);font-size:11.5px;display:block;margin-bottom:2px}
.h-it .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.vacio{color:var(--ink3);font-size:13.5px;padding:20px 12px;line-height:1.6;text-align:center}

/* El pie es parte del SHELL (fila del flex del body), ya no `position:fixed`:
   asi no tapa el contenido ni obliga a un padding-bottom magico de 92px, y en
   la vista Trabajar deja el alto justo para que las columnas terminen donde
   empieza el pie. */
footer.pie{flex:none;background:rgba(15,23,32,.97);border-top:1px solid var(--line);
 padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:30}
.foot-in{max-width:1400px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.foot-in .barra{max-width:250px}
/* El sello de build: la respuesta instantanea a "¿se deployo?" sin abrir
   la consola ni dudar del cache del dispositivo. */
.vtag{font-size:10.5px;color:var(--ink3);opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.18s}
.cerrar-ficha{background:var(--card2);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;
 width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;flex:none}
@media(min-width:1001px){ .cerrar-ficha{display:none} }
@media(max-width:1000px){
 /* Telefono: una sola columna y el scroll vuelve al contenedor — la ficha
    entra como panel deslizante y la columna auxiliar no se muestra. */
 .ops{grid-template-columns:1fr}
 .lista-col{overflow:visible;padding-right:0}
 .extra{display:none}
 body[data-vista="ops"] .app-scroll{overflow-y:auto}
 body[data-vista="ops"] .wrap,
 body[data-vista="ops"] #vOps,
 body[data-vista="ops"] .ops{height:auto;flex:none;display:block}
 .ficha-col{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:61;background:var(--bg2);
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
 .ficha-col.on{transform:none}
 .ov.on{opacity:1;pointer-events:auto}
 .ficha{border:0;border-radius:0;height:100%;display:flex;flex-direction:column}
 .f-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:34px}
 .hoy-grid{grid-template-columns:1fr}
 /* Telefono: el titulo cede su lugar al isotipo (la marca se sigue viendo) y
    los controles quedan todos en la MISMA fila. */
 .brand .txt{display:none}
 .brand{gap:0}
 /* El pie tambien es una sola linea: la barra de progreso se va (el % ya
    esta en el texto) y los botones se achican. */
 footer.pie{padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
 .foot-in{gap:8px;flex-wrap:nowrap;font-size:11.5px}
 .foot-in .barra{display:none}
 .foot-in .btn.sm{padding:5px 9px;font-size:12px;white-space:nowrap}
 #pieTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
 .vtag{display:none}
 /* Los KPIs duplicaban el alto del header sticky en el telefono (dos pisos
    pegados arriba = media pantalla). El dato vive igual en "Como venis" y
    en el pie: en mobile el header queda de UNA linea. */
 header.top .kpis{display:none}
 .big h2{font-size:27px}
 /* En el telefono los formularios de a dos quedan apretados: una columna. */
 .fila2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* El zoom al 80% de la tablet entra las tres columnas pero se come el libreto:
   15px quedan en 12 reales, y esto se lee EN VOZ ALTA con el telefono al oido.
   Se compensa al reves — 18,5 por 0,8 vuelve a los 15 del escritorio. Va al
   FINAL a proposito: mas arriba lo pisan las reglas base del mismo selector.
   Sube solo el texto que se lee, no la interfaz. */
@media(min-width:1001px) and (max-width:1300px){
  .f-body .box{font-size:18px;line-height:1.6}
  .f-body .box.script{font-size:18.5px;line-height:1.66}
  .f-body .sec>label{font-size:18px}
  .f-body .quien .nom{font-size:22px}
  .cierre-frase{font-size:16px}
  .mod .tx b{font-size:14px} .mod .tx i{font-size:13px} .mod li{font-size:13px}
}

/* En el telefono la cabecera del cierre entraba a los tirones y partia las
   dos frases en cuatro renglones: el "cuando" pasa abajo, en su linea. */
@media(max-width:700px){
  .cierre-b > .cab{flex-wrap:wrap;line-height:1.3}
  .cierre-b > .cab .cuando{margin-left:0;flex:0 0 100%;margin-top:2px}
}

let db = cargar(), vista = 'hoy', fPais = '', fEstado = '', q = '', selId = null;
let paisHoy = '';
let tope = 25;   // cuantas filas se dibujan de una
const KEY_META = 'munify_llamados_meta', KEY_PAIS = 'munify_llamados_paishoy';
function metaDiaria(){ let n = 5; try { n = parseInt(localStorage.getItem(KEY_META) || '5', 10); } catch(e){}
  return isNaN(n) ? 5 : Math.max(1, Math.min(20, n)); }

function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
function reg(id){ if(!db[id]) db[id] = {estado:'', notas:'', proximo:'', quien:'', hist:[]}; return db[id]; }
const NL = String.fromCharCode(10);   // salto de linea, sin escapes en medio del HTML
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function telHref(t){ return 'tel:' + String(t).replace(/[^\d+]/g,''); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fecha(iso){ try { return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } }
function fechaCorta(f){ try { return new Date(f+'T12:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'}); } catch(e){ return f; } }
function poblacion(c){ const n = parseInt(String(c.habitantes).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
function pendientes(){ return CONTACTOS.filter(c => !((db[c.id]||{}).estado)); }
function agendados(){
  return CONTACTOS.map(c => ({c, r: db[c.id]||{}}))
    .filter(x => x.r.proximo && x.r.estado !== 'descartado')
    .sort((a,b) => a.r.proximo.localeCompare(b.r.proximo));
}
function delPais(arr){ return paisHoy ? arr.filter(c => c.pais === paisHoy) : arr; }
/* Orden de paises para la ronda (dueno, 2026-08-30): ARGENTINA PRIMERO, y
   recien cuando se agote, el resto. Ordenar solo por poblacion ponia arriba a
   Ciudad de la Costa (~600.000) por sobre cualquier municipio argentino, y
   arrancar la operacion por el mercado que menos se conoce es al reves de lo
   que conviene. Dentro de cada pais sigue mandando la poblacion.
   Un pais que no este listado va al final, no se pierde. */
/* De donde sale la pantalla que crea la demo. Se elige por HOST para que la
   ronda de QA no cree municipios en la base productiva: produccion son dos
   hostnames listados y todo lo demas es QA, que es el lado seguro del error. */
const LANDING = ['app.munify.com.ar','munify.com.ar','www.munify.com.ar'].indexOf(location.hostname) !== -1
  ? 'https://munify.com.ar' : 'https://qa.munify.com.ar';
const ISO_PAIS = {'Argentina':'AR','Paraguay':'PY','Uruguay':'UY','Chile':'CL','Perú':'PE','Bolivia':'BO'};
function urlDemo(c){
  return LANDING + '/demo?m=' + encodeURIComponent(c.localidad)
       + '&pais=' + (ISO_PAIS[c.pais] || 'AR') + '&origen=llamados';
}
/* A quien se le pasa la posta. Un solo lugar: si manana atiende otra persona,
   se cambia aca y no en cinco textos sueltos. */
/* El aviso de la posta va al WhatsApp Business de Munify ("Munify Me"),
   que NO es el 11 6052-6449 de la landing: ese es el publico, para que
   escriban los intendentes. Este es el interno, donde llegan las postas. */
const POSTA = { nombre: 'Lucas', wa: '5491138518148' };
const ORDEN_PAIS = ['Argentina'];
const rankPais = c => { const i = ORDEN_PAIS.indexOf(c.pais); return i < 0 ? 99 : i; };

/* Dentro del pais, el orden es AL AZAR (dueno, 2026-08-30) — no por poblacion:
   asi la ronda pasea por Cordoba, Entre Rios, Salta y Jujuy en vez de bajar la
   lista de los mas grandes, que caen casi todos en las mismas tres provincias.

   Pero al azar ESTABLE por dia: se siembra con la fecha, no con Math.random().
   Si cambiara en cada refresco, el sugerido de arriba y la cola de abajo
   dirian cosas distintas cada vez que se toca algo, y quien llama pierde el
   hilo de a quien venia siguiendo. Manana la baraja es otra. */
function azarDelDia(id){
  let h = 0, sem = hoyISO() + '|' + id;
  for (let i = 0; i < sem.length; i++) h = (h * 31 + sem.charCodeAt(i)) >>> 0;
  return h / 4294967295;
}

/* La cola del dia: primero lo prometido que ya vencio, despues los pendientes
   por pais prioritario y, dentro de cada uno, de mayor poblacion. Con un pais
   elegido a mano manda ese; si se agota, sigue el resto. */
function colaDelDia(n){
  const hoy = hoyISO();
  const deuda = agendados().filter(x => x.r.proximo <= hoy).map(x => x.c);
  const frescos = pendientes().slice().sort((a,b) =>
    rankPais(a) - rankPais(b) || azarDelDia(a.id) - azarDelDia(b.id));
  const cola = [];
  const push = c => { if (c && !cola.some(x => x.id === c.id)) cola.push(c); };
  delPais(deuda).forEach(push);
  delPais(frescos).forEach(push);
  if (paisHoy){ deuda.forEach(push); frescos.forEach(push); }
  return n ? cola.slice(0, n) : cola;
}
function siguienteSugerido(){ return colaDelDia(1)[0] || null; }
/* ============================================================
   "Despues seguis con" INTELIGENTE (dueño, 2026-08-28): la cola se arma
   alrededor del ANCLA (el sugerido de arriba, o el ultimo que trabajaste)
   con criterios explicables — y cada item DICE por que sigue el:
     · lo prometido ya vencido            (+50)  "le prometiste volver"
     · lo que quedo a medio cerrar        (+34)  rellamar sin fecha
     · no atendio (y hoy no lo llamaste)  (+26)  reintento
     · misma zona que el ancla            (+18)  se aprovecha el envion
     · tamaño similar al ancla            (+10)  misma problematica operativa
   Desempate: poblacion. Todo sale de datos REALES de la ficha y de TU uso
   (estados, notas, agenda): la cola cambia sola a medida que trabajas.
   ============================================================ */
function colaInteligente(n){
  const hoy = hoyISO();
  const ancla = siguienteSugerido();
  const llamadosHoy = new Set();
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(h => {
    if (h.tipo === 'llamada' && h.t.slice(0,10) === hoy) llamadosHoy.add(c.id);
  }));
  const logAncla = ancla ? Math.log10(Math.max(poblacion(ancla), 1)) : null;
  const puntuar = c => {
    const r = db[c.id] || {};
    let pts = 0, razon = '';
    if (r.proximo && r.proximo <= hoy){ pts += 50; razon = 'le prometiste volver'; }
    else if (r.estado === 'rellamar'){ pts += 34; razon = 'quedó a medio cerrar'; }
    else if (r.estado === 'no-atiende' && !llamadosHoy.has(c.id)){ pts += 26; razon = 'no atendió, reintentá'; }
    if (ancla && c.region && c.region === ancla.region){
      pts += 18; if (!razon) razon = 'misma zona que ' + ancla.localidad;
    }
    if (logAncla != null && Math.abs(Math.log10(Math.max(poblacion(c), 1)) - logAncla) < 0.3){
      pts += 10; if (!razon) razon = 'tamaño similar, misma problemática';
    }
    pts += Math.min(Math.log10(Math.max(poblacion(c), 1)), 8);
    return {c, pts, razon};
  };
  const candidatos = CONTACTOS.filter(c => {
    const r = db[c.id] || {};
    if (c.id === (ancla && ancla.id)) return false;
    if (r.estado === 'contactado' || r.estado === 'descartado') return false;
    if (r.proximo && r.proximo > hoy) return false;   // agendado a futuro: vive en la agenda
    if (llamadosHoy.has(c.id) && r.estado !== 'rellamar') return false;
    return true;
  });
  const orden = arr => arr.map(puntuar).sort((a, b) => b.pts - a.pts);
  const cola = [];
  const push = x => { if (x && !cola.some(y => y.c.id === x.c.id)) cola.push(x); };
  orden(delPais(candidatos)).forEach(push);
  if (paisHoy) orden(candidatos).forEach(push);
  return n ? cola.slice(0, n) : cola;
}
function llamadasDeHoy(){
  const hoy = hoyISO(), ids = new Set();
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(x => {
    if (x.tipo === 'llamada' && x.t.slice(0,10) === hoy) ids.add(c.id);
  }));
  return ids.size;
}
function movimientos(n){
  const out = [];
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(h => out.push({c, h})));
  return out.sort((a,b) => b.h.t.localeCompare(a.h.t)).slice(0, n);
}
function marcarLlamada(id){
  const r = reg(id);
  r.hist.push({t:new Date().toISOString(), tipo:'llamada', txt:'Llamada iniciada'});
  if (!r.estado) r.estado = 'no-atiende';
  guardar(); pintar(); reportarProgreso();
}
