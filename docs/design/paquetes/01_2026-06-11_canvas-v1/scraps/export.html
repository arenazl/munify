<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Munify · export</title>
<meta name="viewport" content="width=1200,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand.css" />
<style>
  html, body { margin: 0; padding: 0; background: #888; }
  body { font-family: var(--sans); }
  #stage {
    position: absolute; top: 0; left: 0;
    /* size set per-card via JS */
    overflow: hidden;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="text/babel" src="../brand.jsx?v=3"></script>
<script type="text/babel" src="../profile.jsx?v=3"></script>
<script type="text/babel" src="../catalog.jsx?v=3"></script>
<script type="text/babel" src="../banners.jsx?v=3"></script>
<script type="text/babel">
const REGISTRY = {
  'profile':       { Comp: ProfilePic,         w: 640,  h: 640 },
  'profile-alt':   { Comp: ProfilePicMarkOnly, w: 640,  h: 640 },
  'cover':         { Comp: CoverCard,          w: 1080, h: 1080 },
  'combo':         { Comp: ComboCard,          w: 1080, h: 1080 },
  'reclamos':      { Comp: ReclamosCard,       w: 1080, h: 1080 },
  'tramites':      { Comp: TramitesCard,       w: 1080, h: 1080 },
  'tesoreria':     { Comp: TesoreriaCard,      w: 1080, h: 1080 },
  'renaper':       { Comp: RenaperCard,        w: 1080, h: 1080 },
  'soporte':       { Comp: SoporteCard,        w: 1080, h: 1080 },
  'plan-estandar': { Comp: PlanEstandarCard,   w: 1080, h: 1080 },
  'plan-express':  { Comp: PlanExpressCard,    w: 1080, h: 1080 },
  'plan-premium':  { Comp: PlanPremiumCard,    w: 1080, h: 1080 },
  'demo':          { Comp: DemoCard,           w: 1080, h: 1080 },
  'fb-editorial':  { Comp: BannerEditorial,    w: 851,  h: 315 },
  'fb-promo':      { Comp: BannerPromo,        w: 851,  h: 315 },
  'fb-split':      { Comp: BannerSplit,        w: 851,  h: 315 },
};

const stage = document.getElementById('stage');
const root = ReactDOM.createRoot(stage);
window.__currentCard = null;

function render() {
  const id = location.hash.replace('#', '') || 'cover';
  const entry = REGISTRY[id];
  if (!entry) { stage.innerHTML = `<div style="padding:40px">unknown: ${id}</div>`; return; }
  document.body.style.width = entry.w + 'px';
  document.body.style.height = entry.h + 'px';
  document.body.style.minWidth = entry.w + 'px';
  document.body.style.minHeight = entry.h + 'px';
  stage.style.width  = entry.w + 'px';
  stage.style.height = entry.h + 'px';
  root.render(<entry.Comp/>);
  window.__currentCard = id;
}

window.addEventListener('hashchange', render);
// initial render — wait one tick for components to mount
setTimeout(render, 50);

// Direct render hook for exporters (avoids the "same-hash → no hashchange"
// trap where re-selecting the current card wouldn't re-render).
window.__show = function (id) { location.hash = '#' + id; render(); };

// === Export API used by eval_js ===========================================
// Renders the card matching `id`, waits for fonts to settle, and returns a
// base64 PNG data URL via html-to-image. We do this rather than relying on
// save_screenshot so we can capture at the card's native px size (1080×1080
// or 640×640) regardless of the iframe viewport.
window.exportCard = async function exportCard(id, opts = {}) {
  location.hash = '#' + id;
  render();
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 800));
  const entry = REGISTRY[id];
  if (!entry) throw new Error('unknown card ' + id);
  const canvas = await window.html2canvas(document.getElementById('stage'), {
    width: entry.w,
    height: entry.h,
    scale: 1,
    useCORS: true,
    allowTaint: true,
    backgroundColor: null,
    logging: false,
  });
  const fmt = opts.format || 'jpeg';
  const dataUrl = fmt === 'png'
    ? canvas.toDataURL('image/png')
    : canvas.toDataURL('image/jpeg', 0.95);
  window.__lastPng = dataUrl;
  return { id, w: entry.w, h: entry.h, len: dataUrl.length, fmt };
};
window.getPngChunk = function (start, len) {
  return window.__lastPng.slice(start, start + len);
};
window.allCardIds = Object.keys(REGISTRY);
</script>
</body>
</html>
