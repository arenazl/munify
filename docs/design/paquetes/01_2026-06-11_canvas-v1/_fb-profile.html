<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#444;}
  .frame{
    width:512px;height:512px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    float:left;background:#0E1830;
  }
  .frame .depth{position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,255,255,0.07), transparent 58%),
      radial-gradient(circle at 78% 20%, rgba(200,162,78,0.13), transparent 50%);
  }
  .stack{position:relative;display:flex;flex-direction:column;align-items:center;}
  .frame svg{display:block;overflow:visible;}
  .word{font-family:'Fraunces',Georgia,serif;font-style:normal;font-weight:500;
    color:#fff;line-height:1;letter-spacing:-0.01em;font-variation-settings:"opsz" 144;}

  /* --- escudo (reusable) white-on-navy --- */
</style>
</head>
<body>

<!-- A) solo icono -->
<div class="frame" id="perfil-icon">
  <div class="depth"></div>
  <div class="stack">
    <svg width="366" height="322" viewBox="-175.14 0 1621.93 1426">
      <polygon fill="#FFFFFF" points="1271.65 371.24 1271.65 1069.5 635.82 1426 0 1069.5 0 356.5 635.82 0 1128.59 276.29 1000.48 381.26 636.9 177.4 160.18 444.69 160.18 979.27 636.9 1246.56 1113.62 979.27 1113.62 544.87 1271.65 371.24"/>
      <polygon fill="#4F86D6" points="1446.79 79.97 1225.77 330.78 1113.62 458.05 644.86 989.99 448.06 781.76 448.06 568.98 637.63 759.38 1052.94 410.67 1179.19 304.66 1446.79 79.97"/>
      <polygon fill="#FFFFFF" points="404.64 517.83 404.64 1037.89 253.8 953.49 253.8 500.38 332.09 454.86 404.64 517.83"/>
      <polygon fill="#FFFFFF" points="1020.14 650.78 1020.14 954.08 867.22 1039.31 868.09 818.95 1020.14 650.78"/>
    </svg>
  </div>
</div>

<!-- B) icono + texto -->
<div class="frame" id="perfil-icon-texto">
  <div class="depth"></div>
  <div class="stack" style="gap:26px;">
    <svg width="300" height="264" viewBox="-175.14 0 1621.93 1426">
      <polygon fill="#FFFFFF" points="1271.65 371.24 1271.65 1069.5 635.82 1426 0 1069.5 0 356.5 635.82 0 1128.59 276.29 1000.48 381.26 636.9 177.4 160.18 444.69 160.18 979.27 636.9 1246.56 1113.62 979.27 1113.62 544.87 1271.65 371.24"/>
      <polygon fill="#4F86D6" points="1446.79 79.97 1225.77 330.78 1113.62 458.05 644.86 989.99 448.06 781.76 448.06 568.98 637.63 759.38 1052.94 410.67 1179.19 304.66 1446.79 79.97"/>
      <polygon fill="#FFFFFF" points="404.64 517.83 404.64 1037.89 253.8 953.49 253.8 500.38 332.09 454.86 404.64 517.83"/>
      <polygon fill="#FFFFFF" points="1020.14 650.78 1020.14 954.08 867.22 1039.31 868.09 818.95 1020.14 650.78"/>
    </svg>
    <span class="word" style="font-size:78px;">Munify</span>
  </div>
</div>

</body>
</html>
