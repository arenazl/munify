<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llamados">
<title>Llamados Munify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap">
<style>
:root{
 --bg:#0f1720; --bg2:#141e2a; --card:#1a2635; --card2:#213040; --line:#2b3b4e; --line2:#3a4c62;
 --ink:#e8eef6; --ink2:#9db0c6; --ink3:#6d829c;
 --acc:#3d8bfd; --acc2:#2f6fd0; --acc-soft:#1b2c45;
 --ok:#35c07f; --warn:#e2a33c; --bad:#e06c6c; --purple:#9a7bdc;
 --r:12px;
 /* La display de los heroes semanticos de la app (--pl-font-display = Sora):
    los titulos de seccion hablan el mismo idioma que el resto de Munify. */
 --font-display:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root[data-tema="claro"]{
 --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f7; --line:#dfe5ec; --line2:#c8d2de;
 --ink:#16212e; --ink2:#4d5f75; --ink3:#7c8ca1;
 --acc:#2f6fd0; --acc2:#245ab0; --acc-soft:#e5eefb;
 --ok:#1e9e63; --warn:#b57611; --bad:#c94a4a; --purple:#7357bd;
}
:root[data-tema="claro"] header.top,:root[data-tema="claro"] footer.pie{background:rgba(244,246,249,.97)}
:root[data-tema="claro"] .row,:root[data-tema="claro"] .tarj,:root[data-tema="claro"] .ficha{box-shadow:0 1px 2px rgba(20,34,51,.05)}
:root[data-tema="claro"] .eb.on[data-e=contactado],:root[data-tema="claro"] .eb.on[data-e=no-atiende]{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* APP-SHELL 100% FIJO (regla del dueño, 2026-08-28, estandar 11 de
   base-compartida): html/body clavados al viewport y SIN scroll propio —
   scrollea SOLO .app-scroll (y los paneles internos controlados). Es lo que
   hace que la PWA no se "vaya a los costados" ni rebote como pagina web. */
html,body{margin:0;padding:0;width:100%;height:100%;max-width:100%;overflow:hidden;
 overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 touch-action:pan-y;display:flex;flex-direction:column}
.app-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
 -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.paises,.kpis{touch-action:pan-x pan-y}
input,textarea,select,button{font-family:inherit;font-size:16px}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px 92px}

header.top{flex:none;z-index:40;background:rgba(15,23,32,.96);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding-top:max(env(safe-area-inset-top),8px)}
.top-in{max-width:1400px;margin:0 auto;padding:0 14px 10px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px;font-size:17px}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--purple));
 display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;font-weight:800}
.spacer{flex:1}
.switch{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.switch button{border:0;background:transparent;color:var(--ink2);border-radius:999px;padding:6px 15px;
 cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.switch button.on{background:var(--acc);color:#fff}
.switch button:hover:not(.on){color:var(--ink)}
.tema{background:var(--card);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;width:34px;height:34px;
 cursor:pointer;display:grid;place-items:center;flex:none;transition:.12s;padding:0}
.tema:hover{border-color:var(--acc);color:var(--acc)}
.tema svg{width:17px;height:17px;display:block}
.kpis{display:flex;gap:7px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.kpi b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.pu b{color:var(--purple)}

.hoy-grid{display:grid;grid-template-columns:1.25fr .95fr;gap:13px;margin-top:14px}
.big{background:linear-gradient(140deg,var(--acc),var(--purple));border-radius:14px;padding:20px;color:#fff}
.big .k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;opacity:.88;font-weight:700}
.big h2{font-size:32px;font-weight:800;line-height:1.05;margin:7px 0 3px;letter-spacing:-.6px}
.big .s{font-size:13.5px;opacity:.93;line-height:1.5}
.big .s b{font-weight:700}
.big .acciones{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.big a.bl{background:#fff;color:var(--acc2);border:0;border-radius:9px;padding:11px 16px;
 font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums}
.big button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:9px;
 padding:11px 15px;font-weight:600;font-size:14px;cursor:pointer}

.hoy-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.hoy-top .tit{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-right:4px}
.paises{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 13px;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap;font-weight:600}
.pchip:hover{border-color:var(--acc);color:var(--ink)}
.pchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pchip .n{opacity:.72;font-size:11px;margin-left:5px;font-weight:500}
.meta-dia{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:13px}
.meta-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.meta-top .n{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.meta-top .de{font-size:13px;color:var(--ink3)}
.meta-top .frase{margin-left:auto;font-size:13px;color:var(--ink2);text-align:right}
.meta-top .frase b{color:var(--ink)}
.pasos{display:flex;gap:5px}
.pasos i{flex:1;height:8px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.pasos i.ok{background:var(--ok);border-color:var(--ok)}
.pasos i.hoy{background:var(--acc);border-color:var(--acc)}
.meta-cfg{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink3)}
.meta-cfg input{width:54px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;
 padding:4px 8px;color:var(--ink);text-align:center;font-size:13px;font-weight:700}
.cola-hoy{display:grid;gap:7px}
.cola-it{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:8px 10px;
 background:var(--card2);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.cola-it:hover{border-color:var(--acc)}
.cola-it .pos{font-size:12px;color:var(--ink3);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cola-it .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cola-it .sb{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cola-it .why{color:var(--acc);font-weight:600}

.ia-btn{background:linear-gradient(135deg,var(--purple),var(--acc));color:#fff;border:0;border-radius:9px;
 padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ia-btn:hover{filter:brightness(1.08)}
.ia-btn svg{width:15px;height:15px}
.ia-wrap{margin-top:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card2);overflow:hidden}
.ia-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);
 font:700 14px/1.25 var(--font-display);letter-spacing:-.2px;color:var(--ink)}
.ia-msgs{display:grid;gap:8px;padding:12px 13px;max-height:320px;overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y}
.ia-msg{font-size:13.5px;line-height:1.6;padding:10px 12px;border-radius:10px;white-space:pre-wrap}
.ia-msg.yo{background:var(--acc-soft);border:1px solid var(--acc);color:var(--ink);margin-left:22px}
.ia-msg.ia{background:var(--card);border:1px solid var(--line);color:var(--ink2);margin-right:22px}
.ia-msg.err{background:var(--card);border:1px solid var(--bad);color:var(--bad)}
.ia-sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 13px 11px}
.ia-sug button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 11px;font-size:12px;cursor:pointer;text-align:left}
.ia-sug button:hover{border-color:var(--purple);color:var(--ink)}
.ia-input{display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--line)}
.ia-input input{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:9px;
 padding:9px 12px;color:var(--ink);outline:none;font-size:14px}
.ia-input input:focus{border-color:var(--purple)}
.ia-nota{font-size:11.5px;color:var(--ink3);padding:0 13px 11px;line-height:1.5}
.tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tarj h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:700 14px/1.25 var(--font-display);
 letter-spacing:-.2px;color:var(--ink)}
.ag-it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ag-it:last-child{border-bottom:none}
.ag-it:hover .ag-nom{color:var(--acc)}
.ag-nom{font-weight:650;font-size:14px}
.fecha{font-size:11.5px;background:var(--card2);color:var(--ink2);border-radius:6px;padding:3px 8px;
 white-space:nowrap;font-weight:600;border:1px solid var(--line2)}
.fecha.hoy{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.paisrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.paisrow .nm{width:78px;color:var(--ink2);font-weight:600;flex:none}
.barra{flex:1;height:7px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .3s}
.paisrow .num{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;width:54px;text-align:right;flex:none}
.resumen{font-size:13.5px;color:var(--ink2);line-height:1.6;border-top:1px solid var(--line);margin-top:11px;padding-top:11px}
.resumen b{color:var(--ink)}

.ops{display:grid;grid-template-columns:335px 1fr 285px;gap:13px;margin-top:14px;align-items:start}
.ops-col{min-width:0}
.lista-col{position:sticky;top:112px;max-height:calc(100vh - 132px);overflow-y:auto;padding-right:3px}
.extra{position:sticky;top:112px}
.filtros{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.chip{border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip .n{opacity:.7;font-size:11px;margin-left:4px}
.buscar{flex:1;min-width:150px}
.buscar input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:999px;
 padding:8px 14px;color:var(--ink);outline:none}
.buscar input:focus{border-color:var(--acc)}

.controles{display:grid;gap:7px;margin-bottom:10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);
 border:1px solid var(--line2);border-radius:9px;padding:8px 28px 8px 12px;color:var(--ink);
 font-size:13.5px;font-weight:600;cursor:pointer;outline:none;text-overflow:ellipsis}
.sel select:focus{border-color:var(--acc)}
.sel:after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
 border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-70%) rotate(45deg)}
.sel select option{background:var(--card);color:var(--ink)}
.conteo{font-size:12px;color:var(--ink3);padding:1px 3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.conteo b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:700}
.conteo .limpiar{margin-left:auto;color:var(--acc);cursor:pointer;font-weight:600}

/* ---- Paginado de la lista: nada de 154 filas de corrido ---- */
.mas{width:100%;margin-top:9px;border:1px dashed var(--line2);background:transparent;color:var(--ink2);
 border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer}
.mas:hover{border-color:var(--acc);color:var(--acc)}
.mas span{color:var(--ink3);font-weight:400}

/* ---- Tarjetas plegables (solo se pliegan en el telefono) ---- */
.tarj details{margin:0}
.tarj > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
 font:700 14px/1.25 var(--font-display);letter-spacing:-.2px;color:var(--ink)}
.tarj > summary::-webkit-details-marker{display:none}
.tarj > summary .flecha{margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink3);
 border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
.tarj[open] > summary .flecha{transform:rotate(-135deg)}
.tarj > summary .cuenta{background:var(--card2);border:1px solid var(--line);border-radius:999px;
 padding:1px 8px;font-size:11px;letter-spacing:0;color:var(--ink2);font-weight:700}
.tarj > summary + *{margin-top:10px}

@media(max-width:1000px){
  /* la barra de paises no envuelve: una linea que se desliza */
  .paises{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;
   scrollbar-width:none}
  .paises::-webkit-scrollbar{display:none}
  .hoy-top{margin-top:11px}
  .hoy-grid{gap:10px}
  .big{padding:16px}
  .big h2{font-size:25px}
  .big .acciones{margin-top:11px}
  .big a.bl,.big button.gh{padding:10px 13px;font-size:14px}
  .tarj{padding:11px 12px}
  .meta-dia{padding:11px 12px;margin-top:10px}
  .meta-top .n{font-size:23px}
  .meta-top .frase{margin-left:0;text-align:left;flex-basis:100%;font-size:12.5px}
  /* filas mas bajas: entran mas municipios sin scrollear tanto */
  .row{padding:9px 10px;gap:9px}
  .est{height:28px}
  .info h4{font-size:14px}
  .tel-btn{padding:7px 11px;font-size:12.5px}
  .controles{gap:6px;margin-bottom:9px}
  .hist{max-height:none}
}
.lista{display:grid;gap:7px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
 display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--line2);background:var(--card2)}
.row.sel{border-color:var(--acc);background:var(--acc-soft)}
.row.done{opacity:.62}
.est{width:6px;height:32px;border-radius:4px;background:var(--line2);flex:none}
.est.contactado{background:var(--ok)} .est.no-atiende{background:var(--warn)}
.est.rellamar{background:var(--purple)} .est.descartado{background:var(--bad)}
.info{min-width:0}
.info h4{margin:0 0 2px;font-size:14.5px;font-weight:700;letter-spacing:-.15px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink2);font-weight:600}
.tel-btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;text-decoration:none;
 border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tel-btn:hover{background:var(--acc2)}
.tel-btn.hecho{background:var(--card2);color:var(--ink2);border:1px solid var(--line2)}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);
 color:var(--ink3);margin-left:5px;vertical-align:1px}
.badge.n{border-color:var(--purple);color:var(--purple)}
.badge.ojo{border-color:var(--warn);color:var(--warn)}

.ficha{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
 touch-action:pan-y}
/* El cuerpo de la ficha SOLO va vertical, EN TODOS LOS ANCHOS (antes vivia
   solo en la media query mobile y el desktop quedaba sin la regla): un
   contenido apenas mas ancho (una URL larga) habilitaba el arrastre lateral
   adentro del panel aunque el shell estuviera clavado. */
.f-body{overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
.f-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.f-head>div{flex:1;min-width:0}
.f-head h2{margin:0 0 3px;font-size:23px;letter-spacing:-.4px}
.f-head .meta{font-size:13px;white-space:normal}
.f-body{padding:14px 16px 18px}
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
/* Titulos de seccion con IDENTIDAD (pedido del dueño, 2026-08-28): la Sora
   de los heroes, chiquita y con su marca de acento — un golpe de vista y ya
   sabes que viene, en lugar del microrotulo gris que hacia "panel panel". */
.sec>label{display:flex;align-items:center;gap:8px;font:700 14.5px/1.25 var(--font-display);
 letter-spacing:-.2px;color:var(--ink);margin-bottom:8px}
/* El iconito diferenciador de cada seccion (pedido del dueño): un pantallazo
   y ya sabes que informacion agrega el panel. SVG inline, color semantico. */
.sic{width:15px;height:15px;flex:none;display:inline-flex}
.sic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sic.a{color:var(--acc)} .sic.p{color:var(--purple)} .sic.o{color:var(--ok)}
.sic.w{color:var(--warn)} .sic.n{color:var(--ink3)}
/* Menos "panel panel panel" (dueño, 2026-08-28): el box PLANO deja de ser
   tarjeta — texto con un hairline a la izquierda, respira. Los que cargan
   SEMANTICA (script/perfil/dato/ojo) conservan su tarjeta tintada: son los
   que tienen que saltar a la vista. */
.box{background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;
 padding:2px 0 2px 13px;font-size:13.5px;color:var(--ink2);line-height:1.6;overflow-wrap:anywhere}
.box+.box{margin-top:9px}
.box.script,.box.perfil,.box.dato,.box.ojo{background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:11px 13px}
.box.script{border-left:3px solid var(--acc);color:var(--ink)}
.box.perfil{border-left:3px solid var(--purple)}
.box.dato{border-left:3px solid var(--ok)}
.box.ojo{border-left:3px solid var(--warn)}
.box b{color:var(--ink)}
.quien{background:linear-gradient(135deg,var(--acc-soft),transparent);border:1px solid var(--acc);
 border-radius:10px;padding:12px 14px;margin-bottom:13px}
.quien .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.quien .nom{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:3px 0 1px}
.quien .sub{font-size:12.5px;color:var(--ink2)}
.p-tel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.p-tel a.tel-btn{flex:1;justify-content:center;font-size:16px;padding:13px}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:9px;padding:9px 13px;
 cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--ink)}

plataforma de gestión ciudadana que centraliza los reclamos de bacheo, luminarias y servicios en un solo tablero inteligente para el Ejecutivo. Hoy los municipios chicos están resolviendo la trazabilidad de los reclamos en menos de 48 horas sin que el vecino tenga que ir presencialmente a la municipalidad a hacer colas. ¿Con quién me sugerís que converse cinco minutos para dejarle un caso de éxito medido en su misma provincia?"},"Paraguay":{"titulo":"Paraguay","pulso":"Hay muchísimo orgullo por el crecimiento económico, el comercio y el desarrollo local. Valoran enormemente la prolijidad institucional, la transparencia administrativa frente a la Junta Municipal (concejales) y el orden de los tributos.","angulo":"Transparencia, recaudación ordenada y modernización al nivel de las grandes ciudades del Mercosur.","script":"¿Cómo le va, muy buenos días? Le hablo desde Argentina en representación de Munify. Estamos expandiendo nuestra plataforma de gestión y reporte ciudadano a municipios pujantes de Paraguay, enfocándonos en intendencias que están digitalizando la atención al contribuyente. Nuestra herramienta le permite al intendente tener tableros de control en tiempo real sobre el estado de los servicios urbanos y las cuadrillas en la calle, evitando la dispersión de reclamos por WhatsApp o llamadas sueltas. ¿Me podría derivar con el director de gabinete o secretaría general para enviarle un breve resumen de cómo estamos trabajando en ciudades de escala similar?"},"Perú":{"titulo":"Perú","pulso":"Las municipalidades manejan presupuestos por canon (minero, petrolero, aduanero) y están bajo la lupa fiscal permanente de la Contraloría General de la República. El alcalde sufre horrores la gestión documentaria ineficiente y la falta de indicadores de cumplimiento para rendir cuentas.","angulo":"Trazabilidad de obras, cumplimiento de metas institucionales (como los incentivos municipales del MEF) y ordenamiento frente a la Contraloría.","script":"Buenos días, estimado, le saludo de la empresa tecnológica Munify. Nos estamos comunicando con municipalidades provinciales y distritales que están optimizando sus indicadores de gestión y la atención ciudadana. Nosotros proveemos un sistema integral de trazabilidad de reportes urbanos y expedientes que le asegura al despacho de alcaldía métricas claras de resolución ante la Contraloría y los vecinos. ¿Con qué área de gerencia municipal o sistemas podría coordinar una demostración técnica de 10 minutos adaptada a la jurisdicción?"},"Uruguay":{"titulo":"Uruguay","pulso":"Es una administración extremadamente metódica, seria, de procesos muy formales. No les gusta la venta agresiva ni el \"vendehumo\". Van directo a los papeles, los antecedentes institucionales y la robustez técnica.","angulo":"Gobierno abierto, descentralización departamental y optimización de flujos de trabajo de las direcciones de obras y servicios.","script":"Buenos días, ¿cómo le va? Lo molesto brevemente desde Munify. Somos una compañía de desarrollo de software enfocada en plataformas de gobierno abierto y gestión de incidencias para administraciones públicas locales. Estamos vinculándonos con las Intendencias Departamentales del interior uruguayo para aportar tableros de control dinámicos que agilicen la respuesta de las direcciones territoriales. ¿Me indicaría cuál es el canal formal o la secretaría de intendencia para hacerle llegar nuestro dossier corporativo y un acceso de cortesía a nuestras estaciones de prueba?"}},"tips":[{"titulo":"La \"Patria Comtec\" o la empresa establecida","texto":"Como dijiste que sos de Argentina y estás establecido acá, úsalo a favor. En Paraguay, Perú y Uruguay hay un gran respeto por el desarrollo de software argentino (por la industria potente que hay). Decir \"somos una empresa tecnológica consolidada en Argentina\" te da chapa de estabilidad y soporte técnico real, no sos un pibe con una notebook desde su casa."},{"titulo":"El gancho de la demo express","texto":"Si el secretario te l 9/10-07-2025, mandato hasta 2030. El cargo es DEPARTAMENTAL, no de la ciudad.","partido":"Partido Nacional"}},"investigacion":{"argentina-bariloche":{"color":"La Fiesta Nacional de la Nieve: la edición 55, del 13 al 16 de agosto de 2026, arrancó con la Bajada de Antorchas en el cerro Catedral y la tradicional chocolatada en el Centro Cívico.","digital":"Los vecinos ya hacen reclamos y pedidos de servicio de forma digital con usuario y contraseña propios; el municipio usa el módulo de gestión de la plataforma MuniDigital y sumó un portal para iniciar trámites en línea. También existe Reclamos OMIDUC (defensa del consumidor).","estructura":"Organigrama publicado en bariloche.gov.ar/organigrama y nómina de autoridades 2025 en PDF. Se verifica la Secretaría de Gestión Estratégica y Modernización (la que impulsó la digitalización) y áreas de Infraestructura Urbana, Higiene Urbana, Sanidad Animal y Espacios Verdes, más delegaciones barriales.","web":"https://www.bariloche.gov.ar/"},"argentina-comodoro-rivadavia":{"color":"Comodoro es la capital nacional del petróleo: el primer yacimiento del país se descubrió el 13 de diciembre de 1907, a unos 3 km al norte del Cerro Chenque, con una perforadora que buscaba agua. El Cerro Chenque sigue siendo el símbolo de la ciudad.","digital":"En agosto de 2026 lanzaron la app 'Mi Calle' para reportar baches, alumbrado, pérdidas de agua y roturas de veredas desde el celular, con derivación directa al área. Antes ya tenían Oficina de Atención Ciudadana (0800@comodoro.gov.ar) y el portal EnCoSeP para reclamos de servicios públicos.","estructura":"10 secretarías: Gobierno, Modernización y Transparencia; Control Urbano y Operativo; Desarrollo Humano y Familia; La Mujer, Género, Juventud y Diversidad; Infraestructura, Obras y Servicios Públicos; Cultura; Comunicación y Relaciones Institucionales; Recaudación; Salud; y Economía, Finanzas y Control de Gestión (organigrama en el portal de Gobierno Abierto, 'Mapa del Estado').","web":"https://www.comodoro.gov.ar/"},"argentina-godoy-cruz":{"color":"Godoy Cruz es el barrio bodeguero de Mendoza: ahí está Bodega Escorihuela Gascón (1884), una de las más antiguas de la provincia, y el Estadio Feliciano Gambarte del Godoy Cruz Antonio Tomba, al que le dicen 'La Bodega'.","digital":"Municipio muy digitalizado: app 'Reclamos Godoy Cruz' (Android y, desde mayo de 2026, también iPhone), que exige registro como Ciudadano Digital y permite geolocalizar y adjuntar fotos; además consulta de reclamos web en webapps.godoycruz.gob.ar/reclamo.","estructura":"5 secretarías: Ambiente, Obras y Servicios Públicos; Gobierno y Participación Ciudadana; Hacienda; Desarrollo Humano; y Legal y Técnica.","web":"https://www.godoycruz.gob.ar/"},"argentina-la-banda":{"color":"La Banda es cuna de poetas y cantores: ahí nació el Festival Nacional de la Chacarera, gestado en 1991 y realizado desde 1992, impulsado por Eduardo 'Chaca' Carabajal.","digital":"Portal oficial con acceso a servicios y trámites en línea; presencia activa en Facebook e Instagram (@labandamunicipio). No se verificó app de reclamos ni portal de seguimiento.","web":"https://labanda.gob.ar/"},"argentina-lujan-de-cuyo":{"color":"Luján de Cuyo es la cuna del Malbec argentino y en 1993 fue la primera zona del país en conseguir la Denominación de Origen Controlada (DOC); aporta el 31% de la superficie provincial cultivada con esa variedad.","digital":"Muy digitalizado: app 'Mi Luján de Cuyo Reclamos' con reportes georreferenciados y notificaciones de cambio de estado, más el sistema multicanal Luján 147 (portal ciudadano, teléfono, mail, presencial). El formulario web ordena los reclamos en seis rubros: agua, arbolado, alumbrado, cloacas, obras viales y municipales, y servicios públicos.","estructura":"Se verifican, entre otras, la Secretaría de Servicios Públicos (higiene urbana, recolección, alumbrado y espacios verdes) y la Secretaría de Convivencia Ciudadana. El organigrama completo no se pudo verificar online.","web":"https://lujandecuyo.gob.ar/"},"argentina-olavarria":{"color":"Olavarría es la Capital Nacional del Cemento y sigue siendo el mayor productor del país: Alfredo Fortabat fundó Loma Negra en 1926 tras descubrir las canteras de caliza, y la minería marcó la identidad de Sierras Bayas, Sierra Chica y Calera Avellaneda.","digital":"Municipio con varios canales: formulario web de nueva solicitud/reclamo, la plataforma 'Olavarría Interactiva' para reportar en tiempo real (alumbrado, animales sueltos, arbolado, seguridad vial, obras), la app 'Ojos en Alerta' (2019) para denuncias, WhatsApp 'Vecinos en Red' y Centro de Monitoreo que recibe unas 800 denuncias por mes.","estructura":"Organigrama publicado y versionado en el portal de Datos Abiertos del municipio (datosabiertos.olavarria.gov.ar), con la estructura jerárquica de funcionarios actualizada por fecha.","web":"https://www.olavarria.gov.ar/"},"argentina-presidencia-roque-saenz-pena":{"color":"Sáenz Peña es la Capital Nacional del Algodón y sede de la Fiesta Nacional del Algodón (unos 50.000 visitantes); también la llaman 'La Termal' por el Complejo Termal Doctor José Pavlotzky. El capullo de algodón y las líneas onduladas de las termas están en la bandera de la ciudad.","digital":"Sitio institucional con sección de estructura y responsabilidades por secretaría y documentos publicados; no se verificó app de reclamos ni portal de seguimiento online.","estructura":"11 secretarías: Gobierno y Modernización; Desarrollo Humano y Deportes; Gestión y Promoción Educativa; Planificación y Control de Gestión; Economía; Cultura y Educación Ciudadana; Servicios Públicos; Obras Públicas; Desarrollo Local; Relaciones Institucionales; y General e Información Pública.","web":"https://saenzpena.gob.ar/"},"argentina-rawson":{"color":"Rawson es el segundo departamento más poblado de San Juan; nació de Villa Krause, loteo privado de Domingo Krause oficializado por ley provincial en 1919, y el departamento se creó el 4 de septiembre de 1942. Tiene fiesta propia: la Fiesta de las Destrezas Criollas y el Folclore, la cuarta fiesta nacional de la provincia.","digital":"Municipio bastante digitalizado: app 'Mi Ciudad Rawson' (Play Store) con registro del vecino, derivación instantánea al sector y notificación al celular cuando se resuelve; asistente virtual 'Lito' por WhatsApp 24 h (+54 9 264 5702020); Portal Único de Trámites, portal tributario y portal de Gobierno Abierto.","estructura":"Las secretarías se crean por ordenanza a iniciativa del intendente (Carta Orgánica). Se verifican las áreas de Intendencia, Obras y Servicios, Desarrollo Humano y una Subsecretaría de Transformación Digital. Sede: Bv. Sarmiento 474 (Oeste), Villa Krause.","web":"https://municipioderawson.gob.ar/"},"argentina-san-martin":{"color":"San Martín es el departamento con más viñedos y bodegas de Mendoza y por ordenanza 2.542 de 2012 se declaró el mayor productor nacional de uva Bonarda: se presenta como la capital internacional del Bonarda. Ahí está el Museo Las Bóvedas, en tierras que fueron del General San Martín.","digital":"Usan la plataforma MuniDigital para formularios online, más Oficina Virtual de trámites (web.sanmartinmza.gob.ar), portal de rentas tercerizado (infogov) y portal de turismo propio. No se encontró app ni sistema de reclamos georreferenciado.","estructura":"No se pudo verificar el listado de secretarías: el sitio oficial no publica un organigrama. Se verifica una Secretaría General de Gobierno que coordina con Intendencia y canaliza quejas, pedidos y sugerencias de vecinos.","web":"https://sanmartinmza.gob.ar/"},"argentina-san-rafael":{"color":"San Rafael hace la Vendimia departamental más grande de Mendoza y abrió el calendario vendimial 2026 con la Fiesta Provincial de la Flor de la Vid; su postal es el Cañón del Atuel, 50 km entre el embalse El Nihuil y Valle Grande.","digital":"Tienen RAFAELLA, asistente virtual (smart bot) para consultas y reclamos 24 h desde el sitio, que genera número de seguimiento; se complementa con el 0800-222-0600 y un sistema de historia virtual para seguir trámites online.","estructura":"3 secretarías: Hacienda; Obras y Servicios Públicos; y Gobierno (la más extensa, con direcciones de salud, educación, desarrollo social, cultura, deportes, turismo y defensa civil). Además, delegaciones distritales con delegados y subdelegados.","web":"https://www.sanrafael.gov.ar/"},"argentina-tandil":{"color":"El salame de Tandil fue el primer alimento elaborado del país en obtener denominación de origen, y la ciudad hace cada año el festival del salame más largo del mundo, con piezas de más de 400 metros. La Piedra Movediza, su emblema, se cayó en 1912 y en 2007 pusieron una réplica.","digital":"Portal de Gobierno Abierto propio (gobiernoabierto.tandil.gov.ar) con organigrama y datos publicados, guía de trámites con formularios descargables y la app Centinela para denuncias de vecinos.","estructura":"8 secretarías: Gobierno; Economía y Administración; Planeamiento y Obras Públicas; Legal y Técnica; Protección Ciudadana; Desarrollo Humano y Hábitat; Desarrollo Productivo y Relaciones Internacionales; y Servicios Públicos.","web":"https://www.tandil.gov.ar/"},"argentina-villa-mercedes":{"color":"La Fiesta Nacional de la Calle Angosta, en el anfiteatro Alfonso y Zabala: se hace desde 1984 y la edición 37 fue en enero de 2026, con más de 40 puestos gastronómicos, 90 stands de artesanos y 150 de emprendedores. Nace de la cueca cuyana homónima y de la calle de una sola vereda.","digital":"Sistema Único de Reclamos y portal 'Mi Barrio en Línea', más Portal de Servicios Web (portalwebvillamercedes.gob.ar) con consulta de reclamos, consulta de expedientes, libreta sanitaria y generación de VEP. Línea de reclamos 147.","estructura":"8 áreas de primera línea: Intendencia; Secretaría General; Deporte, Cultura y Turismo; Desarrollo Social; Infraestructura, Obras y Servicios Urbanos; Economía y Finanzas; Mujer y Género; y Producción, Medio Ambiente y Tecnología.","web":"https://villamercedes.gov.ar/"},"paraguay-caaguazu":{"color":"Caaguazú (del guaraní Ka'á Guasu, 'gran selva') se fundó en 1845 con 11 familias asentadas donde nacen los manantiales del Ykua La Patria; la patrona es la Inmaculada Concepción y al departamento lo llaman la Capital de la Madera.","digital":"Sitio institucional con ordenanzas publicadas y un módulo MECIP; el contacto oficial figura como una casilla de Gmail (municzu@gmail.com). No se verificó portal de reclamos ni app: terreno virgen.","estructura":"Intendencia, Secretaría General y Junta Municipal (con Directiva y comisiones asesoras). Sede: Eugenio A. Garay e/ Mcal. López. Intendencia 0522 43150, Secretaría General 0522 43621.","web":"https://www.caaguazu.gov.py/"},"paraguay-capiata":{"color":"Capiatá fue fundada el 11 de mayo de 1640 por el gobernador Martín de Ledesma Valderrama; su nombre completo es Nuestra Señora de la Candelaria de Capiatá y cada 2 de febrero hace la fiesta patronal de la Candelaria. Intendente desde el 1 de julio de 2026: Francisco López.","digital":"El sitio oficial estaba en mantenimiento al momento de la consulta; la comunicación activa pasa por la cuenta de X @MuniCapiata. La Junta Municipal tiene sitio aparte (jmcapiata.gov.py). Sin canal digital de reclamos verificable: terreno virgen.","web":"https://municipalidadcapiata.gov.py/"},"paraguay-coronel-oviedo":{"color":"Coronel Oviedo es el corazón vial del Paraguay: cruce de las rutas 2, 7 y 8, capital del departamento de Caaguazú. Su patrona es la Virgen del Rosario y hace cada año el Gran Festival del Ajo junto a los festejos de fundación.","digital":"Tienen sitio institucional propio, portal de la Junta Municipal (jmcov.gov.py) con ordenanzas e información pública, y el organigrama alojado en infraestructura de SENATICS. No se verificó canal de reclamos ni app ciudadana.","estructura":"Organigrama institucional publicado en mco.senatics.gov.py/index.php/institucion/organigrama. Se identifica la Dirección de Construcción y Conservación de Obras y la Secretaría General. Sede: Tuyutí c/ Defensores del Chaco. Intendente: Dr. Denis Cohene.","web":"https://coroneloviedo.gov.py/"},"paraguay-encarnacion":{"color":"Encarnación es la capital del carnaval paraguayo: el corso encarnaceno se corre desde 1916 y desde 2012 tiene sambódromo propio sobre la Costanera República del Paraguay, el tercero más grande del mundo detrás de Río y São Paulo.","digital":"Sitio bien armado, con trámites organizados por dirección, organigrama municipal e informes de transparencia (Ley 5189/14) publicados. Tiene Dirección de Tecnología y Procesamiento de Datos propia. No se verificó portal de reclamos ni app ciudadana.","estructura":"23 direcciones municipales publicadas: Gestión Ambiental y Salubridad, Infraestructura Pública y Servicios, Administración y Finanzas, Recaudaciones, Desarrollo Urbano y Territorial, Desarrollo Económico Sustentable, Desarrollo Social Sustentable, Asuntos Jurídicos, Auditoría Interna, Comunicación, Cultura, Deportes, Salud, Salud y Defensa Animal, Policía Municipal, Unidad Operativa de Contrataciones, FONACIDE, Gestión de Riesgos y Desastres, Dirección de la Mujer, Prensa, Talento Humano, Defensa del Consumidor y Tecnología y Procesamiento de Datos.","web":"https://encarnacion.gov.py/"},"paraguay-fernando-de-la-mora":{"color":"Ciudad joven: fue fundada el 28 de febrero de 1939 en honor al prócer Fernando de la Mora. Su fiesta patronal es la Medalla Milagrosa, el 27 de noviembre; y en el barrio Kamba Cuá celebran cada 6 de enero San Baltasar con danza y percusión afroparaguaya, desde 1991.","digital":"Sitio institucional con secciones de ciudad y cultura; comunicación fuerte por Facebook (@MunideFernando) y canal propio de YouTube donde publican trámites y horarios. No se verificó portal de reclamos ni app.","estructura":"No se pudo verificar el organigrama online. Se identifican departamentos de Tributación, Bienes Inmobiliarios y Tránsito (con horario propio, incluso sábados) y una Dirección de Desarrollo Social. Sede: Avda. Mcal. José Félix Estigarribia esq. Capitán Montiel.","web":"https://www.fdm.gov.py/"},"paraguay-lambare":{"color":"El Cerro Lambaré (156 m, sobre el río Paraguay) le da nombre y es el sitio de la resistencia guaraní contra la conquista: la ciudad se llama así por el cacique Lambaré, símbolo popular de esa resistencia.","digital":"Portal con secciones de trámites de Comercio y Tránsito y de Transparencia; atención al contribuyente por WhatsApp (+595 992 430910). No se verificó portal de reclamos ni app ciudadana.","estructura":"El sitio publica Organigrama y Estructura Orgánica en la sección Transparencia (lambare.gov.py/index.php/institucional/organigrama). Se identifican por teléfono directo las áreas de Atención al Contribuyente, Secretaría General, Comercio e Industria, Impuesto Inmobiliario, Desarrollo Urbano y Tránsito, más una Dirección de Gestión del Talento Humano.","web":"https://www.lambare.gov.py/"},"paraguay-luque":{"color":"Luque es la capital universal de la filigrana: unos 300 orfebres trabajan oro y plata con esa técnica (las primeras piezas datan de 1864, cuando la capital del país se trasladó a Luque durante la Guerra de la Triple Alianza), y es centro de luthiers del arpa paraguaya.","digital":"Sitio institucional bajo el lema 'Luque Diferente', con Facebook e Instagram activos (@luquemuni). No se verificó portal de reclamos ni app ciudadana.","estructura":"Organigrama municipal publicado en PDF en el propio sitio (luque.gov.py/wp-content/uploads/2019/09/ORGANIGRAMA-DE-LA-MUNICIPALIDAD-DE-LUQUE.pdf); se identifica una Dirección de Obras Públicas. Sede: Avda. Guillermo Leoz esq. Pasaje Santa Catalina.","web":"https://www.luque.gov.py/"},"paraguay-pedro-juan-caballero":{"color":"Pedro Juan Caballero es frontera seca con Ponta Porã (Brasil): las dos ciudades forman un solo cono urbano de más de 200.000 habitantes donde conviven cuatro lenguas —español, guaraní, jopará y portugués— y el comercio fronterizo es el motor económico.","digital":"Sitio institucional con secciones de transparencia e información pública; no se verificó portal de reclamos ni app ciudadana.","estructura":"El sitio oficial publica un Organigrama Institucional. Se identifican Intendencia (+595 336 272-212), Secretaría General (271-488) y Junta Municipal (274-302). Sede: Curupayty esq. Natalicio Talavera 288. Intendente: Ronald Enrique Acevedo Quevedo.","web":"https://www.municipalidadpjc.gov.py/"},"paraguay-san-lorenzo":{"color":"Es la Ciudad Universitaria del Paraguay: dentro de su ejido está el campus central de 300 hectáreas de la Universidad Nacional de Asunción (1889), el mayor campus del país, con tráfico estudiantil diario desde otras ciudades.","digital":"Sitio con sección de trámites municipales (requisitos y costos publicados) pero sin canal de reclamos online ni app ciudadana verificable.","estructura":"Estructura orgánica y funcional actualizada por Resolución I.M.S.L. N° 268/2021; el sitio publica Organigrama, Intendencia y Manual de Organización y Funciones. No se pudo verificar el detalle de direcciones.","web":"https://www.sanlo.gov.py/"},"peru-arequipa-distritos-cercanos":{"color":"Arequipa cumple años el 15 de agosto (fundada en 1540) y es la Ciudad Blanca por el sillar, la piedra volcánica blanca con la que está construida; su centro histórico es Patrimonio de la Humanidad de la UNESCO desde el año 2000, al pie del Misti.","digital":"Sección Muni Virtual con casilla electrónica, mesa de partes, seguimiento de trámites, libro de reclamaciones y denuncias por corrupción.","estructura":"Municipalidad Provincial de Arequipa: Gerencia Municipal, gerencias y oficinas generales publicadas en muniarequipa.gob.pe/municipalidad/gerencias (incluye gerencia de rentas/tributos y el órgano de apoyo de administración financiera). Sede en Calle El Filtro 501.","web":"https://www.muniarequipa.gob.pe/"},"peru-cajamarca":{"color":"El Carnaval de Cajamarca, declarado Patrimonio Cultural de la Nación en 2002 y conocido como 'la fiesta más alegre del Perú': en 2026 fue del 14 al 18 de febrero y mueve más de 120.000 visitantes al año.","digital":"Mesa de Partes Virtual con Casilla Electrónica propia (casillaelectronica.municaj.gob.pe), operada por la Oficina de Tecnologías de la Información, con soporte técnico telefónico.","estructura":"Municipalidad Provincial de Cajamarca: Gerencia Municipal como órgano de alta dirección, más gerencias de línea, entre ellas Infraestructura Pública (obras, flota vehicular y maquinaria pesada).","web":"https://municaj.gob.pe/"},"peru-chiclayo-distritos":{"color":"Chiclayo es la Capital de la Amistad; su gancho es el Señor de Sipán (tumba moche hallada intacta en 1987, a 33 km) y el Mercado Modelo con su sección de herbolarios y amuletos.","digital":"Mesa de Partes Virtual propia (sgd.munichiclayo.gob.pe:8181/virtual) abierta 24/7, con constancia de presentación inmediata y casilla electrónica para notificaciones. Además tienen Plan de Gobierno Digital 2023-2025 publicado: hay una agenda de digitalización formal, no improvisada.","estructura":"Estructura orgánica y ROF aprobados por Ordenanza Municipal N° 012-2019-MPCH/A (5 títulos, 12 capítulos, 136 artículos). Se verifica la Gerencia de Desarrollo Urbano, concentrada en obras privadas, control urbano, defensa civil y gestión de riesgo, y promoción empresarial y comercio formal.","web":"https://www.munichiclayo.gob.pe/"},"peru-chimbote-santa":{"color":"La fiesta de San Pedrito (29 de junio), con procesión marítima en la bahía: nació en 1774 con pescadores de Huanchaco y fue declarada Patrimonio Cultural de la Nación. Chimbote es uno de los principales puertos pesqueros del Perú.","digital":"Mesa de partes, seguimiento de trámites en línea (munisanta.gob.pe/consulta_expediente.php), Libro de Reclamaciones virtual y TUPA. El vecino Nuevo Chimbote también tiene reclamaciones online.","estructura":"Municipalidad Provincial del Santa: estructura peruana estándar de Gerencia Municipal con gerencias y subgerencias. Sede en Jr. Enrique Palacios 341, Chimbote. Organigrama publicado en el portal de transparencia.","web":"https://web.munisanta.gob.pe/"},"peru-chincha-alta":{"color":"El Festival Verano Negro, cada febrero: Chincha —y sobre todo el distrito de El Carmen— es la capital de la cultura afroperuana, con procesiones, concursos de danza y el Congreso de Afrodescendientes.","digital":"Sección de servicios con Mesa de Partes Virtual, consulta de expedientes, denuncias ambientales y libro de reclamaciones. Teléfono 056-267627.","estructura":"Municipalidad Provincial de Chincha: organigrama publicado en PDF en el portal de transparencia (municipalidadchincha.gob.pe/portal_transparencia/Planeamiento/ORGANIGRAMA.pdf), con Gerencia Municipal a la cabeza.","web":"https://www.municipalidadchincha.gob.pe/"},"peru-cusco-distritos":{"color":"El Inti Raymi del 24 de junio, escenificado en el Qorikancha, la Plaza de Armas y Sacsayhuamán: coincide con el Día del Cusco y es feriado regional desde 1944.","digital":"De los más digitalizados del interior peruano: Mesa de Partes Virtual 24/7 con cuenta personal validada y validez legal según art. 117 de la Ley 27444 (PDF de hasta 12 MB), más un Portal del Ciudadano propio (portalciudadano.cusco.gob.pe).","estructura":"Municipalidad Provincial del Cusco: estructura orgánica regida por la Ordenanza Municipal 039-2012-MPC; organigrama publicado en web.cusco.gob.pe/organigrama.","web":"https://web.cusco.gob.pe/"},"peru-huacho-huaura":{"color":"En la misma provincia está el Balcón de Huaura, donde San Martín dio el primer grito de libertad del Perú el 27 de noviembre de 1820, ocho meses antes de Lima; ahí también se dictó el Reglamento Provisional de 1821, primer instrumento legal del Estado peruano.","digital":"Mesa de Partes Virtual con dominio propio (mesadepartes.munihuaura.gob.pe), casilla electrónica, seguimiento de trámites, libro de reclamaciones y TUPA.","estructura":"Municipalidad Provincial de Huaura, con sede en el Palacio Municipal de Huacho (Calle Colón 150, Plaza de Armas). Estructura peruana estándar de gerencias; el organigrama detallado no se pudo verificar online.","web":"https://www.portal.munihuacho.gob.pe/"},"peru-huamanga-ayacucho":{"color":"Huamanga es 'la ciudad de las 33 iglesias' y su Semana Santa —más de 150 años de tradición— fue declarada Patrimonio Cultural de la Nación por el Ministerio de Cultura en octubre de 2022.","digital":"Sección Servicios Online con Sistema de Gestión Documentaria, Mesa de Partes Virtual (sgd.munihuamanga.gob.pe/mpv) y consulta de estado de trámites, a cargo de la Oficina de Tecnologías de la Información.","estructura":"Municipalidad Provincial de Huamanga: gerencias de Desarrollo Territorial, Desarrollo Humano, Desarrollo Económico, Seguridad Ciudadana y Defensa Civil, y Transporte. Organigrama 2019 en PDF en el sitio. Sede: Portal Municipal 44, Parque Sucre.","web":"https://www.munihuamanga.gob.pe/"},"peru-huancayo":{"color":"La Feria Dominical de Huancayo, que cada domingo ocupa varias cuadras de la Av. Huancavelica (hasta los años 80 se hacía en la Calle Real); y la Fiesta de Santiago con el señalacuy, del 24 al final de julio.","digital":"Plataforma HUANCAYO VIRTUAL (munihuancayo.gob.pe/virtual): módulo de atención en línea con trámites y seguimiento de documentos; además mesa de partes y libro de reclamaciones.","estructura":"Municipalidad Provincial de Huancayo: Concejo Municipal, Alcaldía, Gerencia Municipal y gerencias de línea (Desarrollo Económico, Desarrollo Urbano, Obras Públicas, Tránsito y Transporte, entre otras). Organigrama en PDF: munihuancayo.gob.pe/portal/images/organigrama.pdf","web":"https://www.munihuancayo.gob.pe/portal/"},"peru-huaraz":{"color":"Huaraz es la capital del Callejón de Huaylas, a 3.000 m, entre la Cordillera Blanca (con el Huascarán, 6.768 m, el pico más alto del Perú) y la Cordillera Negra; su evento propio es el Festival del Andinismo Cordillera Blanca, heredero de la Se const CONTACTOS = DATOS.contactos || [];
const SPEECH = DATOS.speeches || {};
const TIPS = DATOS.tips || [];
const FUNC = DATOS.funcionarios || {};
const INVEST = DATOS.investigacion || {};
const KEY = 'munify_llamados_v1', KEY_TEMA = 'munify_llamados_tema', KEY_VISTA = 'munify_llamados_vista';
const ESTADOS = [
  {id:'contactado', lbl:'Contactado'}, {id:'no-atiende', lbl:'No atiende'},
  {id:'rellamar', lbl:'Volver a llamar'}, {id:'descartado', lbl:'Descartado'},
];
const LBL = Object.fromEntries(ESTADOS.map(e => [e.id, e.lbl]));
const COL = {llamada:'var(--acc)', estado:'var(--ok)', nota:'var(--purple)', agenda:'var(--warn)'};

let db = cargar(), vista = 'hoy', fPais = '', fEstado = '', q = '', selId = null;
let paisHoy = '';
let tope = 25;   // cuantas filas se dibujan de una
const KEY_META = 'munify_llamados_meta', KEY_PAIS = 'munify_llamados_paishoy';
function metaDiaria(){ let n = 5; try { n = parseInt(localStorage.getItem(KEY_META) || '5', 10); } catch(e){}
  return isNaN(n) ? 5 : Math.max(1, Math.min(20, n)); }

function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
function reg(id){ if(!db[id]) db[id] = {estado:'', notas:'', proximo:'', quien:'', hist:[]}; return db[id]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function telHref(t){ return 'tel:' + String(t).replace(/[^\d+]/g,''); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fecha(iso){ try { return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } }
function fechaCorta(f){ try { return new Date(f+'T12:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'}); } catch(e){ return f; } }
function poblacion(c){ const n = parseInt(String(c.habitantes).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
function pendientes(){ return CONTACTOS.filter(c => !((db[c.id]||{}).estado)); }
function agendados(){
  return CONTACTOS.map(c => ({c, r: db[c.id]||{}}))
    .filter(x => x.r.proximo && x.r.estado !== 'descartado')
    .sort((a,b) => a.r.proximo.localeCompare(b.r.proximo));
}
function delPais(arr){ return paisHoy ? arr.filter(c => c.pais === paisHoy) : arr; }
/* La cola del dia: primero lo prometido que ya vencio, despues los pendientes
   de mayor poblacion. Con un pais elegido manda ese; si se agota, sigue el resto. */
function colaDelDia(n){
  const hoy = hoyISO();
  const deuda = agendados().filter(x => x.r.proximo <= hoy).map(x => x.c);
  const frescos = pendientes().slice().sort((a,b) => poblacion(b) - poblacion(a));
  const cola = [];
  const push = c => { if (c && !cola.some(x => x.id === c.id)) cola.push(c); };
  delPais(deuda).forEach(push);
  delPais(frescos).forEach(push);
  if (paisHoy){ deuda.forEach(push); frescos.forEach(push); }
  return n ? cola.slice(0, n) : cola;
}
function siguienteSugerido(){ return colaDelDia(1)[0] || null; }
/* ============================================================
   "Despues seguis con" INTELIGENTE (dueño, 2026-08-28): la cola se arma
   alrededor del ANCLA (el sugerido de arriba, o el ultimo que trabajaste)
   con criterios explicables — y cada item DICE por que sigue el:
     · lo prometido ya vencido            (+50)  "le prometiste volver"
     · lo que quedo a medio cerrar        (+34)  rellamar sin fecha
     · no atendio (y hoy no lo llamaste)  (+26)  reintento
     · misma zona que el ancla            (+18)  se aprovecha el envion
     · tamaño similar al ancla            (+10)  misma problematica operativa
   Desempate: poblacion. Todo sale de datos REALES de la ficha y de TU uso
   (estados, notas, agenda): la cola cambia sola a medida que trabajas.
   ============================================================ */
function colaInteligente(n){
  const hoy = hoyISO();
  const ancla = siguienteSugerido();
  const llamadosHoy = new Set();
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(h => {
    if (h.tipo === 'llamada' && h.t.slice(0,10) === hoy) llamadosHoy.add(c.id);
  }));
  const logAncla = ancla ? Math.log10(Math.max(poblacion(ancla), 1)) : null;
  const puntuar = c => {
    const r = db[c.id] || {};
    let pts = 0, razon = '';
    if (r.proximo && r.proximo <= hoy){ pts += 50; razon = 'le prometiste volver'; }
    else if (r.estado === 'rellamar'){ pts += 34; razon = 'quedó a medio cerrar'; }
    else if (r.estado === 'no-atiende' && !llamadosHoy.has(c.id)){ pts += 26; razon = 'no atendió, reintentá'; }
    if (ancla && c.region && c.region === ancla.region){
      pts += 18; if (!razon) razon = 'misma zona que ' + ancla.localidad;
    }
    if (logAncla != null && Math.abs(Math.log10(Math.max(poblacion(c), 1)) - logAncla) < 0.3){
      pts += 10; if (!razon) razon = 'tamaño similar, misma problemática';
    }
    pts += Math.min(Math.log10(Math.max(poblacion(c), 1)), 8);
    return {c, pts, razon};
  };
  const candidatos = CONTACTOS.filter(c => {
    const r = db[c.id] || {};
    if (c.id === (ancla && ancla.id)) return false;
    if (r.estado === 'contactado' || r.estado === 'descartado') return false;
    if (r.proximo && r.proximo > hoy) return false;   // agendado a futuro: vive en la agenda
    if (llamadosHoy.has(c.id) && r.estado !== 'rellamar') return false;
    return true;
  });
  const orden = arr => arr.map(puntuar).sort((a, b) => b.pts - a.pts);
  const cola = [];
  const push = x => { if (x && !cola.some(y => y.c.id === x.c.id)) cola.push(x); };
  orden(delPais(candidatos)).forEach(push);
  if (paisHoy) orden(candidatos).forEach(push);
  return n ? cola.slice(0, n) : cola;
}
function llamadasDeHoy(){
  const hoy = hoyISO(), ids = new Set();
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(x => {
    if (x.tipo === 'llamada' && x.t.slice(0,10) === hoy) ids.add(c.id);
  }));
  return ids.size;
}
function movimientos(n){
  const out = [];
  CONTACTOS.forEach(c => ((db[c.id]||{}).hist || []).forEach(h => out.push({c, h})));
  return out.sort((a,b) => b.h.t.localeCompare(a.h.t)).slice(0, n);
}
function marcarLlamada(id){
  const r = reg(id);
  r.hist.push({t:new Date().toISOString(), tipo:'llamada', txt:'Llamada iniciada'});
  if (!r.estado) r.estado = 'no-atiende';
  guardar(); pintar();
}

function pintarPaisesHoy(){
  const el = document.getElementById('paisesHoy');
  el.innerHTML = ['<button class="pchip' + (paisHoy===''?' on':'') + '" data-p="">Todos<span class="n">'
      + pendientes().length + '</span></button>']
    .concat([...new Set(CONTACTOS.map(c => c.pais))].map(p => {
      const pend = CONTACTOS.filter(c => c.pais === p && !((db[c.id]||{}).estado)).length;
      return '<button class="pchip' + (paisHoy===p?' on':'') + '" data-p="' + esc(p) + '">' + esc(p)
        + '<span class="n">' + pend + '</span></button>';
    })).join('');
  el.querySelectorAll('.pchip').forEach(b => b.onclick = () => {
    paisHoy = b.dataset.p;
    try { localStorage.setItem(KEY_PAIS, paisHoy); } catch(e){}
    pintarHoy();
  });
}
function pintarMetaDia(){
  const hechas = llamadasDeHoy(), meta = metaDiaria(), falta = Math.max(0, meta - hechas);
  const frase = hechas === 0 ? 'Arrancá con el de arriba.'
    : falta === 0 ? '<b>Meta cumplida.</b> Lo que sigue es ganancia.'
    : falta === 1 ? 'Te falta <b>una sola</b>.'
    : 'Te faltan <b>' + falta + '</b>.';
  document.getElementById('metaDia').innerHTML =
      '<div class="meta-top"><span class="n">' + hechas + '</span>'
    + '<span class="de">de ' + meta + ' llamadas de hoy</span>'
    + '<span class="frase">' + frase + '</span></div>'

function filtrados(){
  const t = q.trim().toLowerCase();
  return CONTACTOS.filter(c => {
    if (fPais && c.pais !== fPais) return false;
    const e = (db[c.id]||{}).estado || '';
    if (fEstado === 'pend' ? e !== '' : fEstado && e !== fEstado) return false;
    if (!t) return true;
    const f = FUNC[c.id] || {};
    return (c.localidad + ' ' + c.region + ' ' + c.telefono + ' ' + c.pais + ' ' + (f.intendente||'')).toLowerCase().includes(t);
  });
}
function pintarFiltros(){
  const paises = [...new Set(CONTACTOS.map(c => c.pais))];
  const sp = document.getElementById('selPais');
  sp.innerHTML = '<option value="">Todos los países (' + CONTACTOS.length + ')</option>'
    + paises.map(p => '<option value="' + esc(p) + '"' + (fPais===p?' selected':'') + '>'
        + esc(p) + ' (' + CONTACTOS.filter(c => c.pais === p).length + ')</option>').join('');

  const se = document.getElementById('selEstado');

  se.innerHTML = opts.map(o => {
    const base = fPais ? CONTACTOS.filter(c => c.pais === fPais) : CONTACTOS;
    const n = o.id === '' ? base.length
      : o.id === 'pend' ? base.filter(c => !((db[c.id]||{}).estado)).length

function pintarConteo(n){

/* ============================================================
   "Recordar" CONTEXTUAL (dueño, 2026-08-28): los consejos cambian con la
   SELECCION. Con una ficha abierta, primero lo propio de ese municipio —
   el "ojo" del intendente y lo que anotaste la ultima vez (datos reales,
   nada inventado)— y despues los genericos, ordenados por pais: fuera de
   Argentina, la carta de "empresa argentina establecida" abre; en
   Argentina va al final. Un consejo por vez, rota cada 10 s.
   ============================================================ */
let tipIdx = 0, tipManual = false;

function tipsPara(){
  const c = selId != null ? CONTACTOS.find(x => x.id === selId) : null;
  if (!c) return TIPS;
  const f = FUNC[c.id] || {}, r = db[c.id] || {};
  const propios = [];
  if (f.nota) propios.push({titulo: 'Ojo con ' + c.localidad, texto: f.nota});
  if (r.quien || r.notas) propios.push({titulo: 'La última vez',
    texto: (r.quien ? 'Hablaste con ' + r.quien + '. ' : '') + (r.notas || '')});
  const esAR = c.pais === 'Argentina';
  const peso = t => /comtec|argentin/i.test(t.titulo + ' ' + t.texto) ? (esAR ? 1 : -1) : 0;
  const genericos = TIPS.slice().sort((a, b) => peso(a) - peso(b));
  return propios.concat(genericos);
}

function pintarTip(){
  const caja = document.getElementById('tipsBox'); if (!caja) return;
  const lista = tipsPara(); if (!lista.length) return;
  const i = tipIdx % lista.length, t = lista[i];
  caja.innerHTML = '<div class="box tip"><b>' + esc(t.titulo) + '</b>' + esc(t.texto) + '</div>'
    + '<div class="tip-pts">' + lista.map((x, j) =>
      '<button data-i="' + j + '"' + (j === i ? ' class="act"' : '')
      + ' aria-label="Ver consejo ' + (j + 1) + '"></button>').join('') + '</div>';
  caja.querySelectorAll('.tip-pts button').forEach(b =>
    b.onclick = () => { tipIdx = +b.dataset.i; tipManual = true; pintarTip(); });
}
setInterval(() => { if (!tipManual && tipsPara().length > 1){ tipIdx += 1; pintarTip(); } }, 10000);

function abrir(id){
  const c = CONTACTOS.find(x => x.id === id); if (!c) return;
  selId = id;
  tipIdx = 0; tipManual = false; pintarTip();

  document.getElementById('ficha').innerHTML =

    + '<button class="btn" id="pCopiar">Copiar</button></div>'
    + quien + ojo
    + '<div class="sec"><label><i class="sic p"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></i>Cómo llega el municipio</label><div class="box perfil">' + esc(c.perfil) + '</div></div>'
    + invest
    + (sp.script ? '<div class="sec"><label><i class="sic a"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 21l2-5.6A8.5 8.5 0 1 1 21 11.5Z"/></svg></i>Speech para ' + esc(c.pais) + '</label>'
        + '<div class="box script">' + esc(sp.script) + '</div>'
        + (sp.angulo ? '<div class="box"><b>Ángulo:</b> ' + esc(sp.angulo) + '</div>' : '')
        + '<button class="btn sm" id="pCopiarScript" style="margin-top:8px">Copiar speech</button></div>' : '')
    + '<div class="sec"><label><i class="sic o"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg></i>Cómo terminó la llamada</label><div class="estados" id="pEstados">'
      + ESTADOS.map(e => '<button class="eb' + (r.estado===e.id?' on':'') + '" data-e="' + e.id + '">' + e.lbl + '</button>').join('')

      + '<div class="fila2" style="margin-top:9px">'
      + '<input class="f" id="pQuien" placeholder="Con quién hablé" value="' + esc(r.quien) + '">'
      + '<input class="f" id="pProximo" type="date" value="' + esc(r.proximo) + '"></div>'
      + '<button class="btn p" id="pGuardar" style="margin-top:9px;width:100%">Guardar en el historial</button></div>'
    + '<div class="sec"><label><i class="sic n"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>Historial</label><div class="hist" id="pHist"></div></div>'
    + '<div class="ia-wrap" id="iaBox"></div></div>';

  pintarHist(); iaMontar(c);
  document.getElementById('fichaCol').classList.add('on');
  document.getElementById('ov').classList.add('on');
  const cf = document.getElementById('cerrarFicha'); if (cf) cf.onclick = cerrarFicha;
  document.getElementById('pLlamar').onclick = () => { marcarLlamada(id); abrir(id); };
  document.getElementById('pCopiar').onclick = () => copiar(c.telefono, 'pCopiar', 'Copiar');
  const bs = document.getElementById('pCopiarScript');
  if (bs) bs.onclick = () => copiar(sp.script, 'pCopiarScript', 'Copiar speech');
  document.querySelectorAll('#pEstados .eb').forEach(b => b.onclick = () => {
    r.estado = (r.estado === b.dataset.e) ? '' : b.dataset.e;
    r.hist.push({t:new Date().toISOString(), tipo:'estado', txt: r.estado ? ('Marcado: ' + LBL[r.estado]) : 'Estado borrado'});
    guardar(); abrir(id); pintarKpis(); pintarPie(); pintarHoy();
  });
  document.getElementById('pGuardar').onclick = () => {
    const nt = document.getElementById('pNotas').value.trim();
    r.notas = nt;
    r.quien = document.getElementById('pQuien').value.trim();
    r.proximo = document.getElementById('pProximo').value;
    if (nt) r.hist.push({t:new Date().toISOString(), tipo:'nota', txt: nt});
    if (r.proximo) r.hist.push({t:new Date().toISOString(), tipo:'agenda', txt:'Volver a llamar el ' + r.proximo});
    document.getElementById('pNotas').value = '';
    guardar(); pintarHist(); pintarLista(); pintarHoy();
    const b = document.getElementById('pGuardar'); b.textContent = 'Guardado';
    setTimeout(() => b.textContent = 'Guardar en el historial', 1200);
  };
  pintarLista();
}

/* ============================================================
   ASISTENTE. La key de la IA vive en el SERVIDOR de Munify
   (endpoint /api/public/calls/ia, con rate limit): antes habia
   que pegar una key de Groq POR NAVEGADOR y el dueño lo marco
   como friccion inaceptable (2026-08-28). La pagina le pega a
   /api same-origin, como cualquier app.

   Lo que la IA SI puede: preparar el pitch para ESE municipio,
   contestar una objecion, redactar el mail de seguimiento — con
   la ficha como contexto. Lo que NO: traer datos que no tenemos
   (quien es el intendente hoy). No tiene busqueda web y los
   inventaria; esos datos salen del relevamiento aparte.
   ============================================================ */
const IA_URL = '/api/public/calls/ia';
let iaChat = [];          // {rol, txt} de la conversacion abierta
let iaCargando = false;

function iaContexto(c){
  const f = FUNC[c.id] || {}, inv = INVEST[c.id] || {}, r = db[c.id] || {}, sp = SPEECH[c.pais] || {};
  const L = [];
  L.push('MUNICIPIO: ' + c.localidad + ' (' + c.region + ', ' + c.pais + '), ' + c.habitantes + ' habitantes.');
  if (c.perfil) L.push('PERFIL COMERCIAL: ' + c.perfil);
  if (f.intendente) L.push('AUTORIDAD: ' + f.intendente + ' — ' + (f.cargo || 'Intendente')
    + (f.partido ? ' (' + f.partido + ')' : '') + (f.nota ? '. OJO: ' + f.nota : ''));
  if (inv.estructura) L.push('AREAS DEL MUNICIPIO: ' + inv.estructura);
  if (inv.digital) L.push('NIVEL DE DIGITALIZACION: ' + inv.digital);
  if (inv.color) L.push('DATO DE COLOR: ' + inv.color);
  if (sp.angulo) L.push('ANGULO DE VENTA PARA ' + c.pais + ': ' + sp.angulo);
  if (sp.pulso) L.push('COMO PIENSA EL INTENDENTE DE ' + c.pais + ': ' + sp.pulso);
  if (r.notas) L.push('LO QUE ANOTE DE LA ULTIMA LLAMADA: ' + r.notas);
  if (r.quien) L.push('CON QUIEN HABLE: ' + r.quien);
  if (r.estado) L.push('ESTADO ACTUAL: ' + (LBL[r.estado] || r.estado));
  return L.join('\n');
}

const IA_SUGERENCIAS = [
  'Armame el arranque de la llamada para este municipio',
  'Me dicen que ya tienen un sistema de reclamos, que les contesto',
  'Me dicen que no hay presupuesto, que les contesto',
  'Escribime el mail de seguimiento',
  'Que le pregunto para saber si vale la pena insistir'
];

function iaPintar(c){
  const cont = document.getElementById('iaMsgs'); if (!cont) return;
  if (!iaChat.length){
    cont.innerHTML = '<div class="ia-msg ia">Tengo la ficha de <b>' + esc(c.localidad) + '</b> a mano. '
      + 'Preguntame como encarar la llamada, como contestar una objecion o pedime el mail de seguimiento.</div>';
  } else {
    cont.innerHTML = iaChat.map(m => '<div class="ia-msg ' + m.rol + '">' + esc(m.txt) + '</div>').join('');
  }
  if (iaCargando) cont.innerHTML += '<div class="ia-msg ia">Pensando...</div>';
  cont.scrollTop = cont.scrollHeight;
}

async function iaPreguntar(c, texto){
  if (!texto || iaCargando) return;
  iaChat.push({rol:'yo', txt:texto});
  iaCargando = true; iaPintar(c);
  try {
    // El historial que viaja se recorta a lo ultimo: el contexto pesado (la
    // ficha) va una sola vez en el system y el endpoint tiene tope de tamaño.
    const mensajes = [{role:'system', content: IA_SISTEMA + '\n\nFICHA DEL MUNICIPIO:\n' + iaContexto(c)}]
      .concat(iaChat.slice(-12).map(m => ({role: m.rol === 'yo' ? 'user' : 'assistant', content: m.txt})));
    const res = await fetch(IA_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mensajes}),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
    const txt = String(j.respuesta || '').trim();
    iaChat.push({rol:'ia', txt: txt || 'Vino una respuesta vacia. Proba de nuevo.'});
  } catch(err){
    iaChat.push({rol:'err', txt: 'No pude preguntarle a la IA: ' + err.message});
  }
  iaCargando = false; iaPintar(c);
}

function iaMontar(c){
  iaChat = []; iaCargando = false;
  const cont = document.getElementById('iaBox'); if (!cont) return;
  cont.innerHTML =
      '<div class="ia-head"><i class="sic p"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></svg></i>Asistente</div>'
    + '<div class="ia-msgs" id="iaMsgs"></div>'
    + '<div class="ia-sug" id="iaSug">' + IA_SUGERENCIAS.map((s, i) =>
        '<button data-i="' + i + '">' + esc(s) + '</button>').join('') + '</div>'
    + '<div class="ia-input"><input id="iaInp" placeholder="Preguntale algo sobre esta llamada..." autocomplete="off">'
    + '<button class="btn p" id="iaEnviar">Preguntar</button></div>'
    + '<div class="ia-nota">Responde con la ficha de arriba como contexto. No conoce datos actuales del municipio '
    + '(quien es el intendente hoy, obras, cifras): eso sale del relevamiento, no de la IA.</div>';
  iaPintar(c);
  document.getElementById('iaSug').querySelectorAll('button').forEach(b =>
    b.onclick = () => iaPreguntar(c, IA_SUGERENCIAS[b.dataset.i]));
  const inp = document.getElementById('iaInp');
  const mandar = () => { const t = inp.value.trim(); inp.value = ''; iaPreguntar(c, t); };
  document.getElementById('iaEnviar').onclick = mandar;
  inp.onkeydown = e => { if (e.key === 'Enter') mandar(); };
}

function pintarHist(){
  const r = reg(selId), el = document.getElementById('pHist'); if (!el) return;
  const h = (r.hist || []).slice().reverse();
  el.innerHTML = h.length
    ? h.map(x => '<div class="h-it"><time>' + fecha(x.t) + '</time>'
        + '<span class="dot" style="background:' + (COL[x.tipo]||'var(--line2)') + '"></span>' + esc(x.txt) + '</div>').join('')
    : '<div class="vacio">Todavía no hay movimientos en este municipio.</div>';
}
function cerrarFicha(){
  document.getElementById('fichaCol').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}
function fichaVacia(){
  document.getElementById('ficha').innerHTML = '<div class="vacio" style="padding:70px 26px">'
    + 'Elegí un municipio de la lista y acá aparece su ficha: a quién preguntar, el speech de su país y lo que averiguamos del lugar.</div>';
}
function copiar(txt, btnId, orig){
  const b = document.getElementById(btnId);
  const fin = () => { if(b){ b.textContent = 'Copiado'; setTimeout(() => b.textContent = orig, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fin).catch(fin);
  else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
         try { document.execCommand('copy'); } catch(e){} document.body.removeChild(t); fin(); }
}
function pintarKpis(){
  const c = CONTACTOS.filter(x => (db[x.id]||{}).estado === 'contactado').length;
  const r = CONTACTOS.filter(x => (db[x.id]||{}).estado === 'rellamar').length;
  document.getElementById('kpis').innerHTML =
      '<span class="kpi ok">Contactados <b>' + c + '</b></span>'
    + '<span class="kpi pu">Rellamar <b>' + r + '</b></span>'
    + '<span class="kpi warn">Sin llamar <b>' + pendientes().length + '</b></span>';
}
function pintarPie(){
  const n = CONTACTOS.length, hechos = n - pendientes().length;
  const pct = n ? Math.round(hechos*100/n) : 0;
  document.getElementById('pieBar').style.width = pct + '%';
  document.getElementById('pieTxt').textContent = hechos + ' de ' + n + ' gestionados (' + pct + '%)';
}
function pintar(){ pintarKpis(); pintarPie(); pintarHoy(); if (vista === 'ops'){ pintarFiltros(); pintarLista(); } }
function irA(v){
  vista = v;
  document.getElementById('vHoy').style.display = v === 'hoy' ? '' : 'none';
  document.getElementById('vOps').style.display = v === 'ops' ? '' : 'none';
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { localStorage.setItem(KEY_VISTA, v); } catch(e){}
  if (v === 'ops'){ pintarFiltros(); pintarLista(); if (!selId) fichaVacia(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll('#switch button').forEach(b => b.onclick = () => irA(b.dataset.v));
document.getElementById('q').oninput = e => { q = e.target.value; tope = 25; pintarLista(); };
document.getElementById('ov').onclick = cerrarFicha;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarFicha();
  if (e.key === 'Tab' && e.altKey){ e.preventDefault(); irA(vista === 'hoy' ? 'ops' : 'hoy'); }
});

const LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
function aplicarTema(t){
  document.documentElement.setAttribute('data-tema', t);
  const b = document.getElementById('btnTema');
  b.innerHTML = t === 'claro' ? SOL : LUNA;
  b.title = t === 'claro' ? 'Volver al modo oscuro' : 'Pasar al modo claro';
  b.setAttribute('aria-label', b.title);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'claro' ? '#f4f6f9' : '#0f1720');
  try { localStorage.setItem(KEY_TEMA, t); } catch(e){}
}
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'llamados-munify-' + hoyISO() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { db = JSON.parse(rd.result) || {}; guardar(); pintar(); } catch(err){ alert('El archivo no se pudo leer'); } };
  rd.readAsText(f);
};

(function init(){
  let t = null; try { t = localStorage.getItem(KEY_TEMA); } catch(e){}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'oscuro';
  aplicarTema(t);
  document.getElementById('btnTema').onclick = () =>
    aplicarTema(document.documentElement.getAttribute('data-tema') === 'claro' ? 'oscuro' : 'claro');
  pintarTip();
  try { paisHoy = localStorage.getItem(KEY_PAIS) || ''; } catch(e){}
  let v = null; try { v = localStorage.getItem(KEY_VISTA); } catch(e){}
  /* En el telefono la vista Hoy se plegaba sola: se deja abierto lo urgente
     (lo que prometiste devolver, si hay) y el resto se abre a pedido. */
  if (window.matchMedia('(max-width: 1000px)').matches){
    document.querySelectorAll('#vHoy details.tarj').forEach(d => {
      const esAgenda = !!d.querySelector('#agenda');
      d.open = esAgenda && agendados().length > 0;
    });
  }
  pintar();
  irA(v === 'ops' ? 'ops' : 'hoy');
})();
</script>
